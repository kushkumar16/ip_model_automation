template_sha256: c67c14eb601c9701c3cb44672a204b58f3b9b6c7b3a58405130e56740f0f8928
model_sha256: 2ec66c20f7ea1187602423c3c3ba9d19f6460e7ddf563751e927d7c17e4364fa
tests_sha256: 5caa1419def132b3bffdb96bcfdff61189bf0f999211e68de7e5f4fe0a7ab8c5
findings:
  - id: M40
    class: wait_model_impl
    severity: high
    claim: >-
      qos_config_if is declared wait_for_ack_inline with wait_points
      [refill.REFILL_BASE] and resumes_on: config_applied, but none of the
      model's config-writing APIs block or resume on anything -- they all take
      effect at the instant of the call.
    template: >-
      templates/completion_ip.template.yaml qos_config_if.wait_model (mode:
      wait_for_ack_inline, requester: peer, wait_points:
      [refill.REFILL_BASE], resumes_on: config_applied), and the
      tenant_config transaction's timing_notes: "sampled at reset and on
      config update".
    model: >-
      src/ip_model_automation/completion_ip.py configure_tenant()
      (lines 99-115), set_tenant_alive() (117-129) and credit_tokens()
      (131-147). All three write tenant state and call
      _refresh_eligibility() synchronously, in the same simulated instant as
      the call; none returns an event, blocks, or references
      self.fsm_state["refill"] or REFILL_BASE at all. The gap is
      acknowledged in set_tenant_alive's own docstring: "A write straight to
      tenant_alive -- the only way to express this, since qos_config_if's
      transaction has no field for it on its own", and in refill_process's
      comment at line 546: "qos_config_if's declared wait_for_ack_inline
      gate at this state is not modelled".
    why: >-
      Per the contract, a peer's config write over qos_config_if should not
      take effect until the model reaches refill.REFILL_BASE and asserts
      config_applied. The model instead applies every config write
      immediately, at arbitrary simulated time unrelated to the refill FSM.
      This is exercised at runtime, not just at setup: tests such as
      test_completion_scheduler_stalls_when_tenant_goes_inactive,
      test_completion_set_tenant_alive_stops_the_spin_a_raw_write_would_leave
      and test_completion_credit_tokens_makes_a_now_eligible_tenant_selectable_again
      call set_tenant_alive()/credit_tokens() mid-run and observe the effect
      in the very next state check. Under the declared wait model those
      calls would instead be held until a REFILL_BASE that, in several of
      these same tests, is never reached at all because start_refill_process
      defaults to False -- so a strictly compliant model would never apply
      the update in that run. Anyone reading the model's simulated timing
      for when a config change takes hold is misled.
