template_sha256: adfdea8a3317a0728292db9e69f5ba19c76a65bd8efc02b1e17e65b2cee2dc63
model_sha256: 0417e76fc4ae3e2a0e933774e8ab6780435be10778cc6d587f5269f5b8cd3ea3
