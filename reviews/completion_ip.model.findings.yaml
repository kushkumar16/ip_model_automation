ip: completion_ip
kind: model
template_sha256: 7b00a3e0a5caf9ae6be83fb1cf84a580b3c3640776f362835545f833784da671
model_sha256: 34046eaf11340dabef4fea2a65b3bef8328fa7e6f81efdaba2d617a4a78cb47f
tests_sha256: 96fec3e4016fab320b124fbc29ec3db33aa6581efecec1cc579c164e48e9285e
findings:
  - id: M1
    class: wait_model_impl
    severity: high
    claim: >-
      The declared wait point of `accepted_cmd_if` exists at no simulated time — `accept`
      is assigned `ENQUEUE` and overwritten with `READY` before the next yield — and the
      producer's put never blocks, so nothing about this interface's wait model is
      observable or enforced.
    template: >-
      interfaces[accepted_cmd_if].wait_model: mode `wait_for_ack_inline`, requester `peer`,
      wait_points `[accept.ENQUEUE]`, resumes_on `accept_ready`; notes "a full pending queue
      holds the FSM in `BACKPRESSURE` and deasserts `ready`".
    model: >-
      src/ip_model_automation/completion_ip.py:111 sets fsm_state["accept"] = "ENQUEUE";
      the next statement that touches it is line 100 (`fsm_state["accept"] = "READY"`, loop
      top) with no yield in between. src/ip_model_automation/completion_ip.py:37 and :96 —
      `simpy.Store(env)` with no capacity, so `submit()`'s put event is triggered at once.
    why: >-
      Measured by stepping the environment: over 646 step boundaries covering 50 accepted
      commands (clock 0..2001), `fsm_state["accept"]` was `READY` at every boundary and
      `ENQUEUE` at none, so the state the wait model names cannot be observed by any test,
      log or trace at any simulated time. Measured separately: 1000 concurrent submits all
      completed their put immediately (store capacity `inf`), so the peer never waits for an
      accept and `ready` never deasserts. `tools/check_wait_model_coverage.py` reports
      "OK (1 models implement every declared wait point)" for this IP because it reads the
      assignment in the source, so this interface passes its gate while modelling none of
      the declared blocking behaviour.
  - id: M2
    class: fsm_structure
    severity: high
    claim: >-
      Three of the four declared `refill` states are entered and left with no yield between
      them, so the `refill` FSM is observably in `WAIT_WINDOW` for the whole simulation and
      `ASSESS_USAGE`, `REFILL_BASE` and `PUBLISH_METRICS` exist at no simulated time.
    template: >-
      fsm_processes[refill].states `[WAIT_WINDOW, ASSESS_USAGE, REFILL_BASE, PUBLISH_METRICS]`
      with all four transitions declared; timing_model.fsm_process_delays[refill] operations
      `usage_assessment` 20 cycles, `base_refill` 10 cycles, `metrics_publish` 10 cycles;
      interfaces[qos_config_if].wait_model.wait_points `[refill.REFILL_BASE]`.
    model: >-
      src/ip_model_automation/completion_ip.py:209-220 (`refill_once`) assigns
      `ASSESS_USAGE` (:211), `REFILL_BASE` (:214) and `PUBLISH_METRICS` (:217) back to back
      with no yield anywhere in the function, and :224 reassigns `WAIT_WINDOW` on re-entry to
      the loop. The 20/10/10 cycles are charged at :226-228, before `refill_once()` is called
      and while fsm_state["refill"] still reads `WAIT_WINDOW`.
    why: >-
      Measured by stepping the environment with `start_refill_process=True` and
      `refill_window=50`: across 646 step boundaries and 22 completed refill windows,
      `fsm_state["refill"]` was `WAIT_WINDOW` at every boundary and never anything else. Three
      quarters of the declared FSM is therefore unobservable, and the 40 cycles of declared
      refill work are charged in the wrong state. This also makes `qos_config_if`'s declared
      wait point `refill.REFILL_BASE` unobservable, and makes the
      `refill_restores_token_window` scenario's `fsm_coverage`
      `[refill.ASSESS_USAGE, refill.REFILL_BASE, refill.PUBLISH_METRICS]` impossible for any
      test to check. `tools/check_declared_transitions.py` counts all four transitions as
      taken, because it sees the assignments.
  - id: M3
    class: timing_mismatch
    severity: high
    claim: >-
      The declared no-stall completion path costs 21 cycles / 42 ns, but the model charges
      17 cycles / 34 ns, because `enqueue` runs concurrently with `tenant_select` in a
      separate process and is entirely hidden inside it.
    template: >-
      timing_model.end_to_end_paths[no_stall_completion]: cycles 21, ns 42, path
      `[enqueue, tenant_select, token_check, completion_emit]` (4 + 8 + 5 + 4 = 21);
      timing_model.cycle_time_ns 2.
    model: >-
      src/ip_model_automation/completion_ip.py:102 charges `service_latency` (enqueue, 4) in
      `accept_process`, while :164 charges `tenant_select_latency` (8) concurrently in
      `completion_scheduler`; :174 charges `token_check_latency` (5) and :201
      `emit_latency` (4).
    why: >-
      Measured with the template's own latencies (4/8/5/4): a command submitted at t=0
      completes at t=17, with the traced sequence t=0 IDLE, t=8 CHECK_TOKENS, t=13 EMIT,
      t=17 completed — the 4-cycle enqueue finishes at t=4, inside the scheduler's 8-cycle
      select, and costs nothing. Raising `service_latency` by 20 moves the completion by only
      18 cycles, confirming the overlap; raising each of the other three moves it by the full
      20. Across submit times 0..59 the end-to-end latency measured 14 to 22 cycles depending
      on where the arrival falls in the scheduler's polling period, and steady-state
      completions were spaced 17 cycles apart. Any latency figure taken from this model is
      ~19% below the contract's, and is not even a constant.
  - id: M4
    class: fsm_structure
    severity: high
    claim: >-
      The scheduler enters `STALL_OUTPUT` from `CHECK_TOKENS`, before tokens are checked or
      debited; the template declares that stall only out of `EMIT`, after `debit_tokens`, so
      `EMIT` is never entered under output backpressure and a token-starved command records
      no token stall while `cpl_ready` is low.
    template: >-
      fsm_processes[completion_scheduler].transitions declares `EMIT -> STALL_OUTPUT`
      (condition `output_not_ready`, actions `[hold_completion, increment_output_stall]`) and
      `CHECK_TOKENS -> EMIT` (condition `required_tokens_available_and_output_ready`, actions
      `[debit_tokens]`); there is no `CHECK_TOKENS -> STALL_OUTPUT`. fsm_relationships.
      gating_relationships: `completion_queue_if.cpl_ready` gates
      `completion_scheduler.EMIT`.
    model: >-
      src/ip_model_automation/completion_ip.py:181-188 tests `self.output_ready` and sets
      `fsm_state["completion_scheduler"] = "STALL_OUTPUT"` at :184, before the token check at
      :191 and the debit at :198.
    why: >-
      Measured with `cpl_ready` low: the states observed at step boundaries were
      `['CHECK_TOKENS', 'IDLE', 'STALL_OUTPUT']` and `EMIT` was never among them, so the gate
      the template attaches to `EMIT` is not visible where the contract says to look, and
      token budgets stay untouched (read 5/read_bw 100 unchanged after 200 cycles of stall)
      where the template debits them before stalling. Because the output check precedes the
      token check, a tenant with zero tokens and `cpl_ready` low recorded
      `output_stalls: 14, token_stalls: 0` — the token starvation is invisible in the
      declared `token_stalls` metric, and stall attribution between the two declared
      `gating_relationships` is decided by the model's ordering rather than the contract's.
  - id: M5
    class: fsm_structure
    severity: medium
    claim: >-
      `accept.BACKPRESSURE` is entered on an undeclared condition (tenant not alive) and
      never on the declared one (incoming valid and queue full), and like `ENQUEUE` it is
      assigned and overwritten with no yield, so it exists at no simulated time either.
    template: >-
      fsm_processes[accept].transitions: `READY -> BACKPRESSURE` condition
      `incoming_valid_and_queue_full`, actions `[increment_queue_full_stall]`, and
      `BACKPRESSURE -> READY` condition `queue_space_available`;
      timing_model.fsm_process_delays[accept] operation `queue_full_retry` 1 cycle.
      `tenant_inactive` is declared only as a command error_condition (commands[READ],
      commands[WRITE].error_conditions), not as an `accept` transition.
    model: >-
      src/ip_model_automation/completion_ip.py:103-108: `if not self.tenant_alive[...]` sets
      `fsm_state["accept"] = "BACKPRESSURE"` (:104) and increments
      `metrics["tenant_inactive_stalls"]` (:105), then falls to the loop top at :100 which
      overwrites the state with `READY`. Asserted as correct by
      tests/test_completion_ip.py:59-69
      (`test_completion_inactive_tenant_parks_command_at_accept`).
    why: >-
      Measured with an inactive tenant: `BACKPRESSURE` was assigned but observed at no step
      boundary, and the declared condition cannot occur at all because the pending queues are
      unbounded (queues[tenant_pending_queues].depth `unbounded`) — 5000 submits were all
      accepted with no put ever blocking and no queue-full metric incremented, and the
      declared `queue_full_retry` cycle is never charged. A reader who sees `BACKPRESSURE` in
      this model's source will read it as the queue-full backpressure the template and the
      `accepted_cmd_if` notes describe, when it in fact reports a dead tenant; the command is
      still appended to the pending queue at :106 either way.
  - id: M6
    class: capacity_mismatch
    severity: medium
    claim: >-
      The declared `completion_output_port` resource is not modelled at all — there is no
      SimPy resource in the model — so neither its capacity, its `latency_cycles: 1`, nor its
      one-completion-per-dispatch-tick bandwidth is enforced.
    template: >-
      resources[completion_output_port]: type `completion_port`, capacity 1, bandwidth
      `one_completion_per_dispatch_tick`, latency_cycles 1, arbitration
      `weighted_round_robin`, sharing_scope `global`; declared in
      fsm_processes[completion_scheduler].resources_used; qos.dispatch_tick_ms 1.
    model: >-
      src/ip_model_automation/completion_ip.py:28-61 — the only SimPy object constructed is
      `self.input_q = simpy.Store(env)` (:37); the model holds no `simpy.Resource` or
      `Container`. `completion_scheduler` (:161-207) emits by appending to `self.completed`
      (:202) after `emit_latency`, requesting nothing.
    why: >-
      Measured on the constructed model: the set of SimPy Resource/Container attributes is
      empty, and back-to-back completions were spaced 17 cycles apart — about 29,000
      completions per dispatch tick (qos.dispatch_tick_ms 1 = 500,000 cycles at 500 MHz),
      against a declared bandwidth of one. The port's 1-cycle latency is charged nowhere: the
      measured no-stall path is exactly tenant_select + token_check + emit with no port cost.
      Nothing in the model can ever produce output-port contention or a weighted_round_robin
      arbitration decision at the port, so any utilization figure for
      `completion_output_port` is unbacked. Note for whoever resolves this: the template's own
      21-cycle `no_stall_completion` path is not reconcilable with a one-per-dispatch-tick
      port either, so the question of which rate the contract means may need settling before
      the model can be judged against it.
  - id: M7
    class: fsm_structure
    severity: medium
    claim: >-
      `completion_scheduler.SELECT_TENANT` exists at no simulated time on the completion
      path — it is assigned and overwritten with no yield whenever a candidate is found — so
      the only time the state is observable is when selection fails.
    template: >-
      fsm_processes[completion_scheduler].states includes `SELECT_TENANT`, reached by
      `IDLE -> SELECT_TENANT` (condition `any_pending_command`, actions
      `[load_weighted_tenant_order]`) and left by `SELECT_TENANT -> CHECK_TOKENS` (condition
      `candidate_found`, actions `[peek_candidate]`); fsm_relationships.sequential_paths
      [command_completion_path] lists `completion_scheduler.SELECT_TENANT` as a step of the
      completion path.
    model: >-
      src/ip_model_automation/completion_ip.py:165 sets
      `fsm_state["completion_scheduler"] = "SELECT_TENANT"`; when `_select_tenant()` at :166
      returns a tenant, the next assignment is `CHECK_TOKENS` at :173 with no yield between
      them. Only the empty branch at :167-170 yields while the state reads `SELECT_TENANT`.
    why: >-
      Measured by stepping the environment: in the token-starvation, output-backpressure and
      inactive-tenant runs — every run in which a candidate was found on the first scan —
      `SELECT_TENANT` was assigned but observed at no step boundary; the traced completion of
      a single command goes t=0 IDLE, t=8 CHECK_TOKENS with nothing in between. In the
      mixed-traffic run it was observed only during the polls that found nothing pending. So
      the state is observable exactly when the model is *not* selecting a tenant, which
      inverts its meaning for anyone reading a trace, and a coverage test written against the
      declared `command_completion_path` cannot check this step.
