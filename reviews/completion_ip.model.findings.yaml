ip: completion_ip
kind: model
template_sha256: 3be0d38a41015bb215b3c3fcca649174f1f1da3ee2b9640fd67c4c6b4f556ea2
model_sha256: 90270c9554b9e90470eecccdf5e4f0e2e04bf31eebd7cf77528c4c601e75b9a1
tests_sha256: 442eaf5d190bcf9371aed51c53762cffc6e26601ebb9679211dbf143d5f4d6bc
findings:
  - id: M37
    class: wait_model_impl
    severity: high
    claim: >-
      qos_config_if is declared wait_for_ack_inline with its wait point at
      refill.REFILL_BASE and resumes_on config_applied -- i.e. a peer's
      tenant_config transaction should be gated so it takes effect (and is
      acked) when the refill FSM reaches REFILL_BASE -- but configure_tenant
      applies the new token/liveness values synchronously at call time, with
      no wait, no returned ack event, and no relation to the refill process's
      state at all.
    template: >-
      templates/completion_ip.template.yaml interfaces[1] (qos_config_if):
      wait_model.mode=wait_for_ack_inline, wait_model.wait_points=[refill.REFILL_BASE],
      wait_model.resumes_on=config_applied, wait_model.requester=peer.
    model: >-
      src/ip_model_automation/completion_ip.py configure_tenant()
      (lines 99-115) writes self.tokens/self.base_tokens/self.tenant_alive and
      returns None immediately; refill_process() (lines 515-548) only ever
      calls _restore_base_tokens() as the periodic top-up action on its own
      ASSESS_USAGE -> REFILL_BASE transition and never reads or applies
      anything a configure_tenant call is waiting on, because configure_tenant
      does not wait on anything. Reproduced empirically: calling
      configure_tenant("T0", read=5, ...) while env.run() has left the refill
      process sitting in WAIT_WINDOW (nowhere near REFILL_BASE) updates
      model.tokens["T0"]["read"] to 5.0 immediately, in the same call, with
      model.fsm_state["refill"] still reading "WAIT_WINDOW".
    why: >-
      Any scenario that reconfigures a tenant mid-run (a live QoS budget
      change, or a liveness toggle) takes effect and is "acked" instantly in
      the model instead of at the next refill.REFILL_BASE boundary the
      contract declares, so timing computed from when a configuration change
      becomes visible to the scheduler -- or from when a caller is entitled to
      assume it has been applied -- will not match a design that honors the
      declared inline-ack gate. No test in tests/test_completion_ip.py drives
      configure_tenant/set_tenant_alive/credit_tokens concurrently with the
      refill process to exercise (or pin) this wait point at all, so the gap
      is currently unguarded by any assertion.
