<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4285f4"/>
    </marker>
  </defs>
  <rect width="1220" height="520" fill="#ffffff"/>
  <text x="610" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#202124">Example generated model: Mailbox IP</text>
  <text x="610" y="66" text-anchor="middle" font-size="14" fill="#5f6368">Each template FSM becomes one concurrent SimPy process; queues connect them; every hop costs DLD-stated cycles</text>

  <!-- register_access (top) -->
  <rect x="300" y="100" width="220" height="56" rx="28" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="410" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#174ea6">register_access</text>

  <!-- Sender API -->
  <rect x="40" y="230" width="200" height="66" rx="33" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
  <text x="140" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#202124">Sender API</text>
  <text x="140" y="280" text-anchor="middle" font-size="13" fill="#5f6368">send_message()</text>

  <!-- message_push -->
  <rect x="300" y="235" width="220" height="56" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="410" y="269" text-anchor="middle" font-size="14" font-weight="bold" fill="#174ea6">message_push</text>

  <!-- message_pop -->
  <rect x="620" y="150" width="220" height="56" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="730" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#174ea6">message_pop</text>

  <!-- Receiver -->
  <rect x="950" y="145" width="200" height="66" rx="33" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
  <text x="1050" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#202124">Receiver</text>
  <text x="1050" y="195" text-anchor="middle" font-size="13" fill="#5f6368">read_message()</text>

  <!-- doorbell -->
  <rect x="620" y="320" width="220" height="56" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="730" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#174ea6">doorbell</text>

  <!-- interrupt_notify -->
  <rect x="620" y="430" width="220" height="56" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="730" y="464" text-anchor="middle" font-size="14" font-weight="bold" fill="#174ea6">interrupt_notify</text>

  <!-- IRQ out -->
  <rect x="950" y="425" width="200" height="66" rx="33" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="1050" y="463" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e7e34">IRQ out</text>

  <!-- Flow arrows -->
  <line x1="240" y1="263" x2="295" y2="263" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 520 250 L 570 250 L 570 178 L 615 178" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="570" y="222" text-anchor="middle" font-size="12" fill="#5f6368">message_fifo</text>

  <line x1="840" y1="178" x2="945" y2="178" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 520 278 L 570 278 L 570 348 L 615 348" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="570" y="316" text-anchor="middle" font-size="12" fill="#5f6368">doorbell_queue</text>

  <path d="M 730 376 L 730 425" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="860" y="404" text-anchor="middle" font-size="12" fill="#5f6368">interrupt_pending_queue</text>

  <line x1="840" y1="458" x2="945" y2="458" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- config/mask dashed arrows -->
  <line x1="410" y1="156" x2="410" y2="230" stroke="#4285f4" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowBlue)"/>
  <path d="M 520 128 L 900 128 L 900 300 L 900 440 L 845 440" fill="none" stroke="#4285f4" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowBlue)"/>
  <text x="935" y="290" text-anchor="middle" font-size="12" fill="#4285f4">config / mask</text>

  <!-- Legend -->
  <rect x="40" y="380" width="18" height="18" rx="4" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="66" y="394" font-size="13" fill="#202124">FSM process (from the template)</text>
  <rect x="40" y="410" width="18" height="18" rx="9" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
  <text x="66" y="424" font-size="13" fill="#202124">Software-facing API</text>
  <line x1="40" y1="452" x2="58" y2="452" stroke="#5f6368" stroke-width="2"/>
  <text x="66" y="456" font-size="13" fill="#202124">Queue / store (backpressure when full)</text>
  <line x1="40" y1="482" x2="58" y2="482" stroke="#4285f4" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="66" y="486" font-size="13" fill="#202124">Configuration / interrupt masking</text>
</svg>
