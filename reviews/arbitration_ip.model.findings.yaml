findings:
  - id: M36
    class: fsm_structure
    severity: high
    claim: >-
      Once a candidate has been granted and handed to issue_pipeline but is
      still awaiting downstream issue_ready (or is stuck on a burst stall),
      its SQ stays marked pending in the bitmaps arbiter_main scans, so the
      arbiter repeatedly re-runs PORT_SCAN -> TENANT_SCAN -> SQ_SCAN -> STALL
      on that same already-granted candidate every cycle for the entire
      length of the stall, instead of taking the template's declared
      issue_ready-gated stall path or sitting idle.
    template: >-
      templates/arbitration_ip.template.yaml:333-336 declares
      `gating_relationships: - source: issue_if.issue_ready, gates:
      arbiter_main.ISSUE, stall_reason: output_backpressure` -- issue_ready is
      meant to gate the arbiter itself with its own distinct stall reason --
      and templates/arbitration_ip.template.yaml:103 describes IDLE as "Wait
      for queue activity or downstream availability."
    model: >-
      src/ip_model_automation/arbitration_ip.py:268-284 (`_update_pending_bitmaps`
      marks an SQ pending from queue occupancy alone, never checking
      `self.inflight_sqs`) together with lines 442-452 (the IDLE wait loop
      blocks only on `any(self.port_pending_bitmap.values())`, with no check
      of downstream/issue readiness or in-flight status). Confirmed by
      grep that arbiter_main never records an `output_backpressure` stall
      reason anywhere: `output_backpressure_cycles` is only incremented inside
      `issue_pipeline`, at lines 595 and 642.
    why: >-
      Verified by tracing arbiter_main's FSM state with two commands already
      granted and in flight while issue_ready stayed low: the arbiter looped
      PORT_SCAN(4) -> TENANT_SCAN(6) -> SQ_SCAN(8) -> STALL(1) ->
      PORT_SCAN(4) -> STALL(1) continuously for the whole backpressure window,
      producing (after ~59 cycles of backpressure) stalls=15,
      no_sq_pending_stalls=8, no_port_pending_stalls=7, even though every
      pending SQ was already granted and nothing new could be selected. This
      charges the declared per-scan cycle costs repeatedly for no reason and
      inflates `stalls`/`no_sq_pending_stalls`/`no_port_pending_stalls` --
      metrics performance_model.metrics lists as arbitration-health counters
      -- under a condition (output backpressure, and equally a burst stall,
      since a burst-stalled SQ is left in `inflight_sqs` the same way) the
      template explicitly separates out with its own `output_backpressure`
      stall reason that the model never produces. None of the existing
      backpressure/burst-stall tests
      (tests/test_arbitration_ip.py:286-334, :410-436, :470-498, :861-891)
      check arbiter_main's own stall metrics during the hold, only the
      eventual outcome and issue_pipeline's stall counters, so this churn
      goes unnoticed. In a longer stall or a busier queue this scales with
      the stall duration and misrepresents both simulated arbitration timing
      and the reported stall-reason breakdown.
  - id: M37
    class: scenario_gap
    severity: low
    claim: >-
      The weighted_order_four_tenants test_scenario's declared fsm_coverage
      names `arbiter_main.ISSUE`, a state that does not exist anywhere in
      arbiter_main's declared `states` list or in the model's `fsm_state`
      tracking, so the test written for this scenario neither exercises nor
      could exercise it.
    template: >-
      templates/arbitration_ip.template.yaml:439 (`fsm_coverage: [...
      arbiter_main.GRANT, arbiter_main.ISSUE, policy_update.UPDATE_POINTER]`)
      names `arbiter_main.ISSUE`; arbiter_main's actual declared states, at
      templates/arbitration_ip.template.yaml:99-115, are `RESET, IDLE,
      PORT_SCAN, TENANT_SCAN, CREDIT_REFILL, SQ_SCAN, GRANT, STALL` -- no
      `ISSUE` among them. The same phantom state also appears in
      `gating_relationships` (line 335) and `sequential_paths.policy_update_path`
      (line 331), suggesting a state was renamed (to GRANT) without these
      three references being updated to match.
    model: >-
      tests/test_arbitration_ip.py:138-153
      (test_arbitration_weighted_order_across_four_tenants, the test written
      for this scenario) records only `selection_trace`, never
      `fsm_state["arbiter_main"]`, and could not check ISSUE coverage even if
      it tried to: `self.fsm_state` at src/ip_model_automation/arbitration_ip.py:162-166
      only ever takes the eight states the template itself declares for
      arbiter_main.
    why: >-
      A reader consulting this scenario's fsm_coverage to see what a passing
      test verifies is told it touches a state that has never existed in the
      model, silently overstating this scenario's coverage.
