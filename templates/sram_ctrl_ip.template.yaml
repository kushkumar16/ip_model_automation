ip:
  name: sram_ctrl_ip
  domain: memory_subsystem
  description: Owns the on-chip buffer SRAM shared by the DMA engines and the completion path; accepts
    read, write and RMW requests from the fabric, schedules them across four independent banks, and
    returns ECC-checked data.
  clock_domains:
    - name: core_clk
      frequency_mhz: 800
  reset:
    type: sync
    behavior: clear_queues_and_counters
interfaces:
  - name: request_if
    type: request_accept
    direction: input
    clock_domain: core_clk
    wait_model:
      mode: wait_for_ack_inline
      requester: peer
      wait_points:
        - request_accept.QUEUE_FULL
      resumes_on: an entry frees up
      source: dld
      notes: "The requester does not receive any result at this point — it is waiting only for the\
        \ controller to take the request, and it stalls in the accept path's QUEUE_FULL state until an\
        \ entry frees up."
    transactions:
      - name: request_access
        fields:
          - req_valid
          - req_ready
          - req_id
          - req_addr
          - req_opcode
          - req_bytes
          - req_wdata
          - req_requester
        handshake: valid_ready
        timing_notes: Taken when req_valid and req_ready are both high in the same cycle; accepted
          requests are written into a 16-entry central request queue and then handed to per-bank
          queues, each 4 entries deep; req_ready deasserts when the target queue has no room.
  - name: response_if
    type: response_return
    direction: output
    clock_domain: core_clk
    wait_model:
      mode: wait_for_response
      requester: peer
      wait_points:
        - bank_scheduler.RETURN_DATA
      resumes_on: rsp_valid presented with rsp_id matching the original req_id
      source: dld
      response_used_for: A read requester blocks until its response comes back, because it needs the returned
        data before it can proceed.
      notes: The tag in rsp_id is how it matches the response to the request it issued.
      timeout: indefinite
    transactions:
      - name: response_access
        fields:
          - rsp_valid
          - rsp_ready
          - rsp_id
          - rsp_rdata
          - rsp_status
        handshake: valid_ready
        timing_notes: Responses complete in completion order, not request order, since banks complete
          independently; up to 8 requests may be outstanding across all banks at once; if rsp_ready is
          low the controller holds the response in RETURN_DATA and does not start another access on
          that bank.
  - name: configuration_and_status_if
    type: configuration_and_status
    direction: input
    clock_domain: core_clk
    wait_model:
      mode: wait_for_ack_before_next_request
      requester: peer
      wait_points:
        - ecc_scrub.LOAD_CONFIG
      resumes_on: once it has been taken by the scrub process, which applies it at its next boundary
      source: dld
      notes: A configuration write is acknowledged once it has been taken by the scrub process, which
        applies it at its next boundary; the writing agent waits for that acknowledgement in LOAD_CONFIG
        before issuing another configuration write, and no data comes back to it.
      outstanding_limit: 1
    transactions:
      - name: configuration_and_status_access
        fields:
          - scrub_enable
          - scrub_interval_cycles
          - ecc_correct_enable
          - bank_mask
        handshake: register_write_with_deferred_ack
        timing_notes: A pending configuration write is applied once by the scrub process at its next
          SCRUB_WAIT->LOAD_CONFIG boundary; status counters (corrected_count, uncorrectable_count,
          queue_high_water, per-requester accepted counts) are read-only and updated by REPORT.
commands:
  - name: READ
    description: Read access. Returns data and a status; occupies the bank for the access and the ECC
      check.
    fields:
      - req_id
      - req_addr
      - req_bytes
      - req_requester
    valid_conditions:
      - req_valid_and_req_ready
      - target_bank_queue_has_room
    completion_conditions:
      - response_returned_via_return_data_with_rsp_status
    error_conditions:
      - uncorrectable_ecc_error
    functional_effects:
      - occupies_bank_for_access_and_ecc_check
      - rsp_status_reflects_ok_corrected_or_uncorrectable
    timing_effects:
      - uncontended_latency_11_cycles_13_75_ns
  - name: WRITE
    description: Write access. Takes data with the request and returns no data; the requester is told
      only that the write was accepted.
    fields:
      - req_id
      - req_addr
      - req_bytes
      - req_wdata
      - req_requester
    valid_conditions:
      - req_valid_and_req_ready
      - target_bank_queue_has_room
    completion_conditions:
      - accepted_via_request_if_handshake
    error_conditions: []
    functional_effects:
      - no_read_data_returned
      - issue_access_returns_directly_to_pick_bank_without_visiting_return_data
    timing_effects:
      - uncontended_latency_8_cycles_10_ns
  - name: RMW
    description: Read-modify-write. Reads the line, merges the new bytes, and writes it back; holds the
      bank for both halves and cannot be interleaved with another access to the same bank in between.
    fields:
      - req_id
      - req_addr
      - req_bytes
      - req_wdata
      - req_requester
    valid_conditions:
      - req_valid_and_req_ready
      - target_bank_queue_has_room
    completion_conditions:
      - write_half_issued_after_merge
    error_conditions:
      - uncorrectable_ecc_error_on_read_half
      - rmw_targets_masked_off_bank
    functional_effects:
      - holds_bank_for_both_read_and_write_halves
      - read_half_checked_by_ecc_before_merge
      - write_half_returns_directly_to_pick_bank_without_visiting_return_data
    timing_effects:
      - uncontended_latency_17_cycles_21_25_ns
fsm_processes:
  - name: request_accept
    purpose: Accepts requests from the fabric, decodes the target bank from the address, and pushes
      accepted requests into the per-bank queues; deasserts req_ready when there is no room.
    simpy_process: true
    states:
      - RESET
      - ACCEPT_IDLE
      - DECODE_BANK
      - PUSH_QUEUE
      - QUEUE_FULL
    transitions:
      - from: RESET
        to: ACCEPT_IDLE
        condition: reset_deasserted
        actions:
          - clear_queues_and_counters
        latency_cycles: 0
      - from: ACCEPT_IDLE
        to: DECODE_BANK
        condition: req_valid_and_req_ready
        actions:
          - accept_and_decode_target_bank
        latency_cycles: 2
      - from: DECODE_BANK
        to: PUSH_QUEUE
        condition: target_bank_queue_has_room
        actions:
          - push_into_bank_queue
        latency_cycles: 1
      - from: DECODE_BANK
        to: QUEUE_FULL
        condition: target_bank_queue_full
        actions:
          - deassert_req_ready
          - increment_queue_full_stall
        latency_cycles: 0
      - from: PUSH_QUEUE
        to: ACCEPT_IDLE
        condition: entry_written
        actions:
          - increment_accepted_count
        latency_cycles: 0
      - from: QUEUE_FULL
        to: ACCEPT_IDLE
        condition: entry_drains
        actions:
          - reassert_req_ready
        latency_cycles: 1
    functional_responsibilities:
      - accept_requests_from_fabric
      - decode_target_bank_from_address
      - enqueue_into_central_and_per_bank_queues
      - deassert_ready_on_queue_full
    interfaces_touched:
      - request_if
    queues_used:
      - central_request_queue
      - per_bank_queues
    resources_used: []
  - name: bank_scheduler
    purpose: One scheduler serves all four banks, visiting them in round robin order. It skips a bank
      whose bit is clear in bank_mask.
    simpy_process: true
    states:
      - SCHED_IDLE
      - PICK_BANK
      - ISSUE_ACCESS
      - WAIT_ECC
      - RETURN_DATA
      - RMW_MERGE
    transitions:
      - from: SCHED_IDLE
        to: PICK_BANK
        condition: any_bank_queue_non_empty
        actions: []
        latency_cycles: 0
      - from: PICK_BANK
        to: ISSUE_ACCESS
        condition: bank_chosen_round_robin_skipping_masked
        actions:
          - select_next_serviceable_bank
        latency_cycles: 3
      - from: ISSUE_ACCESS
        to: WAIT_ECC
        condition: request_is_read_or_rmw_read_half
        actions:
          - drive_sram_read_access
        latency_cycles: 4
      - from: ISSUE_ACCESS
        to: PICK_BANK
        condition: request_is_write
        actions:
          - drive_sram_write_access
        latency_cycles: 3
      - from: WAIT_ECC
        to: RMW_MERGE
        condition: request_is_rmw
        actions:
          - check_ecc
        latency_cycles: 2
      - from: WAIT_ECC
        to: RETURN_DATA
        condition: request_is_read
        actions:
          - check_ecc
          - set_rsp_status
        latency_cycles: 2
      - from: RMW_MERGE
        to: ISSUE_ACCESS
        condition: merge_complete
        actions:
          - merge_write_data_into_read_line
        latency_cycles: 3
      - from: RETURN_DATA
        to: PICK_BANK
        condition: rsp_ready_high
        actions:
          - present_response
          - release_bank
        latency_cycles: 0
      - from: RETURN_DATA
        to: RETURN_DATA
        condition: rsp_ready_low
        actions:
          - hold_response
          - hold_bank
        latency_cycles: 0
    functional_responsibilities:
      - round_robin_bank_selection_skipping_masked_banks
      - issue_sram_access
      - wait_for_ecc_check
      - merge_rmw_data
      - hold_response_until_accepted
    interfaces_touched:
      - response_if
    queues_used:
      - per_bank_queues
    resources_used:
      - sram_banks
      - outstanding_request_slots
  - name: ecc_scrub
    purpose: A background process walks the buffer looking for latent single-bit errors.
    simpy_process: true
    states:
      - SCRUB_WAIT
      - LOAD_CONFIG
      - READ_ENTRY
      - CORRECT_ENTRY
      - REPORT
    transitions:
      - from: SCRUB_WAIT
        to: LOAD_CONFIG
        condition: scrub_interval_expired
        actions:
          - advance_scrub_pointer
        latency_cycles: 4096
      - from: LOAD_CONFIG
        to: READ_ENTRY
        condition: configuration_applied
        actions:
          - apply_pending_configuration
        latency_cycles: 0
      - from: READ_ENTRY
        to: CORRECT_ENTRY
        condition: correctable_error_found
        actions:
          - read_scrub_entry
        latency_cycles: 5
      - from: READ_ENTRY
        to: REPORT
        condition: no_correctable_error
        actions:
          - read_scrub_entry
        latency_cycles: 5
      - from: CORRECT_ENTRY
        to: REPORT
        condition: line_rewritten
        actions:
          - write_corrected_entry
        latency_cycles: 6
      - from: REPORT
        to: SCRUB_WAIT
        condition: counters_updated
        actions:
          - update_status_counters
        latency_cycles: 0
    functional_responsibilities:
      - walk_buffer_for_latent_errors
      - apply_pending_configuration_at_boundary
      - correct_and_writeback_single_bit_errors
      - update_status_counters
      - yield_to_demand_traffic
    interfaces_touched:
      - configuration_and_status_if
    queues_used: []
    resources_used:
      - sram_banks
resources:
  - name: sram_banks
    type: bank
    capacity: 4
    arbitration: round_robin_skip_masked
    sharing_scope: per_bank
    notes: An RMW holds its bank for both the read and write halves; the scrub never occupies a bank
      that has a queued demand request waiting.
  - name: outstanding_request_slots
    type: semaphore
    capacity: 8
    notes: Up to 8 requests may be outstanding across all banks at once.
queues:
  - name: central_request_queue
    producer: request_if
    consumer: request_accept
    depth: 16
    blocking_behavior: stall
    ordering: fifo
  - name: per_bank_queues
    producer: request_accept
    consumer: bank_scheduler
    depth: 4
    blocking_behavior: stall
    ordering: fifo_per_bank
fsm_relationships:
  fsm_count: 3
  parallel_processes:
    - - request_accept
      - bank_scheduler
      - ecc_scrub
  sequential_paths:
    - name: request_to_response_path
      path:
        - request_accept.PUSH_QUEUE
        - bank_scheduler.PICK_BANK
        - bank_scheduler.ISSUE_ACCESS
        - bank_scheduler.WAIT_ECC
        - bank_scheduler.RETURN_DATA
      description: A request must be accepted and pushed into its bank queue before the scheduler can
        pick that bank, issue the access, check ECC, and return the response.
    - name: config_apply_path
      path:
        - ecc_scrub.SCRUB_WAIT
        - ecc_scrub.LOAD_CONFIG
        - ecc_scrub.READ_ENTRY
      description: A pending configuration write is only applied once the scrub process reaches its
        next SCRUB_WAIT->LOAD_CONFIG boundary.
  gating_relationships:
    - source: per_bank_queue_full
      gates: request_accept.QUEUE_FULL
      stall_reason: queue_full_stall
    - source: response_if.rsp_ready
      gates: bank_scheduler.RETURN_DATA
      stall_reason: response_backpressure
    - source: per_bank_queue_non_empty
      gates: ecc_scrub.READ_ENTRY
      stall_reason: scrub_yields_to_demand_traffic
timing_model:
  clock_mhz: 800
  cycle_time_ns: 1.25
  assumption: 'Hard-coded starter timing extracted from DLD; all figures are the starter values for
    modelling, not silicon measurements. The RMW merge cost (3 cycles) is derived by subtracting the
    DLD-stated read path (11 cycles) and write access (3 cycles) from the DLD-quoted RMW total (17
    cycles); it is not a separately stated DLD figure.'
  fsm_process_delays:
    - fsm: request_accept
      mode: parallel_process
      operations:
        - name: accept_and_decode_a_request
          cycles: 2
          ns: 2.5
        - name: push_into_a_bank_queue
          cycles: 1
          ns: 1.25
        - name: queue_full_retry
          cycles: 1
          ns: 1.25
    - fsm: bank_scheduler
      mode: parallel_process
      operations:
        - name: pick_the_next_bank
          cycles: 3
          ns: 3.75
        - name: sram_read_access
          cycles: 4
          ns: 5
        - name: sram_write_access
          cycles: 3
          ns: 3.75
        - name: ecc_check
          cycles: 2
          ns: 2.5
        - name: rmw_merge_write_data
          cycles: 3
          ns: 3.75
    - fsm: ecc_scrub
      mode: parallel_process
      operations:
        - name: scrub_interval_wait
          cycles: 4096
          ns: 5120
        - name: scrub_entry_read
          cycles: 5
          ns: 6.25
        - name: ecc_correction_writeback
          cycles: 6
          ns: 7.5
  end_to_end_paths:
    - name: uncontended_read
      cycles: 11
      ns: 13.75
      path:
        - accept_and_decode_a_request
        - pick_the_next_bank
        - sram_read_access
        - ecc_check
    - name: uncontended_write
      cycles: 8
      ns: 10
      path:
        - accept_and_decode_a_request
        - pick_the_next_bank
        - sram_write_access
    - name: uncontended_rmw
      cycles: 17
      ns: 21.25
      path:
        - accept_and_decode_a_request
        - pick_the_next_bank
        - sram_read_access
        - ecc_check
        - rmw_merge_write_data
        - sram_write_access
functionality_model:
  implemented_in_simpy: true
  state_variables:
    - fsm_state
    - transition_counts
    - central_request_queue
    - bank_queues
    - outstanding_requests
    - bank_mask
    - scrub_enable
    - scrub_interval_cycles
    - ecc_correct_enable
    - corrected_count
    - uncorrectable_count
    - queue_high_water
    - per_requester_accepted_counts
    - stall_counters
  apis:
    - run
    - submit_request
    - get_response
    - configure
    - trigger_scrub_now
    - get_metrics
  invariants:
    - A read response is only returned after its ECC status has been checked.
    - An RMW holds its bank for both the read and write halves and cannot be interleaved with another
      access to the same bank in between.
    - The scrub process never occupies a bank that has a queued demand request waiting.
    - Bank selection visits banks in round robin order, skipping any bank cleared in bank_mask.
    - "Conservative default (DLD Open Items, no decision stated): an RMW addressed to a masked-off bank\
      \ is rejected as an error at accept time rather than left to stall indefinitely in a bank the\
      \ scheduler will never service."
    - "Conservative default (DLD Open Items, no decision stated): uncorrectable errors are surfaced only\
      \ through rsp_status and the uncorrectable_count status counter; no interrupt is asserted."
  ignored_payload_details:
    - sram_macro_internal_timing
    - ecc_syndrome_encoding
    - req_wdata_contents_beyond_matching_one_response_to_another
performance_model:
  language: python
  library: simpy
  abstraction_level: transaction
  model_functionality: true
  model_fsm_processes: true
  model_data_payloads: false
  model_interface_backpressure: true
  model_arbitration: true
  model_queue_occupancy: true
  model_latency_sources:
    - queue_wait
    - bank_conflict
    - ecc_check
    - scrub_interference
    - response_backpressure
  metrics:
    - transition_counts
    - latency
    - queue_full_stalls
    - bank_conflicts
    - corrected_count
    - uncorrectable_count
    - queue_high_water
    - per_requester_accepted_counts
    - bank_utilization
test_scenarios:
  - name: uncontended_read_matches_dld_latency
    description: A single read request with no contention completes in the DLD-quoted 11 cycles /
      13.75 ns from acceptance to response.
    input_sequence:
      - REQ0_READ_bank0
    expected_functional_behavior:
      - response_returned_with_rsp_status_ok
      - rsp_id_matches_req_id
    expected_performance_properties:
      - latency_equals_11_cycles_13_75_ns
    fsm_coverage:
      - request_accept.RESET
      - request_accept.ACCEPT_IDLE
      - request_accept.DECODE_BANK
      - request_accept.PUSH_QUEUE
      - bank_scheduler.SCHED_IDLE
      - bank_scheduler.PICK_BANK
      - bank_scheduler.ISSUE_ACCESS
      - bank_scheduler.WAIT_ECC
      - bank_scheduler.RETURN_DATA
  - name: write_completes_without_response_payload
    description: A write request takes data with the request, is told only that it was accepted, and
      the scheduler returns directly to PICK_BANK in the DLD-quoted 8 cycles / 10 ns without visiting
      RETURN_DATA.
    input_sequence:
      - REQ1_WRITE_bank1
    expected_functional_behavior:
      - no_read_data_returned
      - write_accepted_via_request_if_handshake_only
    expected_performance_properties:
      - latency_equals_8_cycles_10_ns
    fsm_coverage:
      - bank_scheduler.ISSUE_ACCESS
      - bank_scheduler.PICK_BANK
  - name: rmw_holds_bank_for_read_merge_and_write
    description: An RMW reads the line, merges the new bytes, and writes it back, holding the bank for
      both halves for the DLD-quoted 17 cycles / 21.25 ns and never visiting RETURN_DATA.
    input_sequence:
      - REQ2_RMW_bank2
    expected_functional_behavior:
      - bank_held_for_both_read_and_write_halves
      - no_interleaved_access_to_same_bank_during_rmw
    expected_performance_properties:
      - latency_equals_17_cycles_21_25_ns
    fsm_coverage:
      - bank_scheduler.WAIT_ECC
      - bank_scheduler.RMW_MERGE
      - bank_scheduler.ISSUE_ACCESS
  - name: central_and_bank_queue_full_deasserts_ready_until_drain
    description: When the target bank queue has no room, req_ready deasserts and the requester stalls in
      QUEUE_FULL until an entry frees up.
    input_sequence:
      - REQ3_READ_bank0
      - REQ4_READ_bank0
      - REQ5_READ_bank0
      - REQ6_READ_bank0
      - REQ7_READ_bank0
    expected_functional_behavior:
      - req_ready_deasserted_while_bank_queue_full
      - req_ready_reasserted_once_entry_drains
    expected_performance_properties:
      - queue_full_stall_incremented
    fsm_coverage:
      - request_accept.DECODE_BANK
      - request_accept.QUEUE_FULL
      - request_accept.ACCEPT_IDLE
  - name: response_backpressure_holds_bank_in_return_data
    description: While rsp_ready is low the controller holds the response in RETURN_DATA and does not
      start another access on that bank.
    input_sequence:
      - REQ8_READ_bank3
      - rsp_ready_low
    expected_functional_behavior:
      - response_held_in_return_data
      - bank_not_started_on_new_access_while_held
    expected_performance_properties:
      - no_additional_stall_counter_for_response_hold
    fsm_coverage:
      - bank_scheduler.RETURN_DATA
  - name: scrub_config_applied_at_next_boundary
    description: A configuration write is acknowledged once taken by the scrub process, which applies it
      at its next SCRUB_WAIT->LOAD_CONFIG boundary; the writing agent waits for that acknowledgement
      before issuing another configuration write.
    input_sequence:
      - CONFIG_WRITE_scrub_interval_cycles_2048
    expected_functional_behavior:
      - configuration_applied_at_next_scrub_boundary
      - second_config_write_blocked_until_ack
    expected_performance_properties:
      - single_outstanding_config_write
    fsm_coverage:
      - ecc_scrub.SCRUB_WAIT
      - ecc_scrub.LOAD_CONFIG
  - name: scrub_yields_to_demand_and_reports_counters
    description: The scrub never occupies a bank with a queued demand request; it corrects a single-bit
      error, writes it back, and updates the corrected/uncorrectable status counters.
    input_sequence:
      - SCRUB_TICK_bank1_has_pending_demand_request
      - SCRUB_TICK_bank2_idle_correctable_error
    expected_functional_behavior:
      - scrub_skips_bank_with_queued_demand_request
      - corrected_entry_written_back
      - status_counters_updated
    expected_performance_properties:
      - corrected_count_incremented
      - uncorrectable_count_unchanged
    fsm_coverage:
      - ecc_scrub.READ_ENTRY
      - ecc_scrub.CORRECT_ENTRY
      - ecc_scrub.REPORT
  - name: rmw_to_masked_bank_rejected_at_accept
    description: Conservative default for an unresolved DLD open item — an RMW addressed to a
      masked-off bank (bank_mask bit clear) is rejected as an error at accept time rather than left to
      stall in a bank the scheduler will never service.
    input_sequence:
      - CONFIG_WRITE_bank_mask_clears_bank1
      - REQ9_RMW_bank1
    expected_functional_behavior:
      - rmw_targets_masked_off_bank_error_raised
      - request_not_enqueued_to_masked_bank
    expected_performance_properties:
      - no_indefinite_stall_on_masked_bank
    fsm_coverage:
      - request_accept.DECODE_BANK
  - name: uncorrectable_error_reported_via_status_only
    description: Conservative default for an unresolved DLD open item — an uncorrectable error is
      surfaced only through rsp_status and the uncorrectable_count status counter; no interrupt is
      asserted.
    input_sequence:
      - REQ10_READ_bank3_uncorrectable_error
    expected_functional_behavior:
      - rsp_status_uncorrectable
      - uncorrectable_count_incremented
      - no_interrupt_asserted
    expected_performance_properties:
      - software_must_poll_uncorrectable_count
    fsm_coverage:
      - bank_scheduler.WAIT_ECC
      - bank_scheduler.RETURN_DATA
