<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 680" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea4335"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34a853"/>
    </marker>
  </defs>
  <rect width="1260" height="680" fill="#ffffff"/>
  <text x="630" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#202124">The automated pipeline runner (tools/auto_ip_pipeline.py)</text>
  <text x="630" y="66" text-anchor="middle" font-size="14" fill="#5f6368">Drop a DLD in dlds/ — a new IP is generated, an existing IP is amended from the template diff</text>

  <!-- Row 1 -->
  <rect x="40" y="110" width="210" height="70" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="145" y="139" text-anchor="middle" font-size="14" font-weight="bold" fill="#174ea6">Watch dlds/</text>
  <text x="145" y="161" text-anchor="middle" font-size="12" fill="#174ea6">content-hash change detection</text>

  <rect x="290" y="110" width="210" height="70" rx="10" fill="#ffffff" stroke="#5f6368" stroke-width="1.5"/>
  <text x="395" y="139" text-anchor="middle" font-size="14" fill="#202124">.docx to markdown</text>
  <text x="395" y="161" text-anchor="middle" font-size="12" fill="#5f6368">(if needed)</text>

  <rect x="540" y="110" width="210" height="70" rx="10" fill="#ffffff" stroke="#5f6368" stroke-width="1.5"/>
  <text x="645" y="139" text-anchor="middle" font-size="14" fill="#202124">Extract draft</text>
  <text x="645" y="161" text-anchor="middle" font-size="12" fill="#5f6368">+ gaps report</text>

  <rect x="790" y="110" width="200" height="70" rx="10" fill="#fff4e5" stroke="#f5a623" stroke-width="2"/>
  <text x="890" y="139" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a6400">Template gates</text>
  <text x="890" y="161" text-anchor="middle" font-size="12" fill="#9a6400">lint + coverage --strict</text>

  <rect x="1030" y="110" width="190" height="70" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="1125" y="139" text-anchor="middle" font-size="14" font-weight="bold" fill="#174ea6">Agent: review</text>
  <text x="1125" y="161" text-anchor="middle" font-size="12" fill="#174ea6">promote the template</text>

  <!-- Fork -->
  <rect x="1000" y="232" width="220" height="58" rx="10" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1110" y="257" text-anchor="middle" font-size="14" font-weight="bold" fill="#202124">Model already exists?</text>
  <text x="1110" y="277" text-anchor="middle" font-size="11" fill="#5f6368">snapshot taken at run start</text>

  <!-- Greenfield -->
  <rect x="620" y="330" width="340" height="72" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="790" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#174ea6">no — generate (greenfield)</text>
  <text x="790" y="379" text-anchor="middle" font-size="12" fill="#174ea6">scaffold + prompt pack · agent implements</text>

  <!-- Brownfield -->
  <rect x="620" y="440" width="340" height="72" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="790" y="468" text-anchor="middle" font-size="14" font-weight="bold" fill="#174ea6">yes — amend (brownfield)</text>
  <text x="790" y="489" text-anchor="middle" font-size="12" fill="#174ea6">template diff · agent edits in place</text>

  <!-- Unit tests -->
  <rect x="380" y="385" width="190" height="72" rx="10" fill="#ffffff" stroke="#5f6368" stroke-width="1.5"/>
  <text x="475" y="413" text-anchor="middle" font-size="14" fill="#202124">Unit tests</text>
  <text x="475" y="434" text-anchor="middle" font-size="12" fill="#5f6368">per-IP suite (the gate)</text>

  <!-- Stamp provenance -->
  <rect x="150" y="385" width="190" height="72" rx="10" fill="#ffffff" stroke="#5f6368" stroke-width="1.5"/>
  <text x="245" y="413" text-anchor="middle" font-size="14" fill="#202124">Stamp provenance</text>
  <text x="245" y="434" text-anchor="middle" font-size="12" fill="#5f6368">model_baselines.json</text>

  <!-- Repo-wide gates -->
  <rect x="110" y="500" width="270" height="66" rx="10" fill="#fff4e5" stroke="#f5a623" stroke-width="2"/>
  <text x="245" y="527" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a6400">Repo-wide gates</text>
  <text x="245" y="548" text-anchor="middle" font-size="11" fill="#9a6400">style · coverage 95/95 · validate_dld_flow.py</text>

  <!-- Done -->
  <rect x="130" y="600" width="230" height="58" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="245" y="624" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e7e34">IP marked processed</text>
  <text x="245" y="645" text-anchor="middle" font-size="11" fill="#1e7e34">reports/.dld_pipeline_state.json</text>

  <!-- Row 1 arrows -->
  <line x1="250" y1="145" x2="285" y2="145" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="145" x2="535" y2="145" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="145" x2="785" y2="145" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="990" y1="145" x2="1025" y2="145" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Down into the fork -->
  <line x1="1125" y1="180" x2="1115" y2="227" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Fork -> greenfield / brownfield -->
  <path d="M 1110 290 L 1110 366 L 965 366" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1110 290 L 1110 476 L 965 476" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Both paths -> unit tests -->
  <path d="M 620 366 L 595 366 L 595 421 L 575 421" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 620 476 L 595 476 L 595 421 L 575 421" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tail: tests -> stamp -> repo gates -> done -->
  <line x1="380" y1="421" x2="345" y2="421" stroke="#34a853" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="362" y="410" text-anchor="middle" font-size="11" fill="#1e7e34">pass</text>
  <line x1="245" y1="457" x2="245" y2="495" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="245" y1="566" x2="245" y2="595" stroke="#34a853" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Fail retry loop back to the fork -->
  <path d="M 475 385 L 475 310 L 1110 310 L 1110 295" fill="none" stroke="#ea4335" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowRed)"/>
  <text x="780" y="302" text-anchor="middle" font-size="12" fill="#ea4335">fail: re-invoke the agent with the failure log (up to loop_policy.max_iterations)</text>
</svg>
