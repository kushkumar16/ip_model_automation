template_sha256: 2e699282ae10f069c7f0edd1ac119868eb925526a041cb6e847473fa8146cb1d
model_sha256: 44881a04e7ebc550a56114f45fac16a19ed3a94a5a2cbd0e0114f56d82b9f0bc
tests_sha256: d2a9ad0e3d8ce526a6876bd7f0d700b5f1630fda74e22031f9e4b2724d1caa9a
findings:
  - id: M5
    class: wait_model_impl
    severity: medium
    claim: >-
      command_intake_if's wait_points names intake_bridge.ACCEPT_COMMAND as the
      state occupied while the host's ack is pending, but the model actually
      fires that ack while intake_bridge is sitting in FORWARD_TO_ARBITRATION,
      one state later.
    template: >-
      templates/storage_pipeline_subsystem.template.yaml command_intake_if.wait_model
      (lines 29-35): "wait_points: [intake_bridge.ACCEPT_COMMAND]". The
      sibling qos_configuration_if.wait_model (lines 45-50) follows the
      convention this codebase uses elsewhere (e.g. completion_ip's
      accept_cmd_if names accept.ENQUEUE, the exact state held across its
      service_latency and succeeded in): it names
      intake_bridge.APPLY_QOS_CONFIG, and the model does hold that exact
      state when its own accepted.succeed() fires.
    model: >-
      src/ip_model_automation/storage_pipeline_subsystem.py lines 124-139:
      self.fsm_state["intake_bridge"] is set to "ACCEPT_COMMAND" at line 124,
      then to "FORWARD_TO_ARBITRATION" at line 127 before the second
      yield self.env.timeout(1) at line 128; accepted.succeed() at line 139
      runs after that second timeout, while self.fsm_state["intake_bridge"]
      still reads "FORWARD_TO_ARBITRATION", not "ACCEPT_COMMAND".
    why: >-
      Anyone reading fsm_state to observe which state a wait_for_ack_inline
      interface is blocked in -- the way this codebase already treats that
      field elsewhere (completion_ip's own accept.ENQUEUE note: "the state is
      entered before the enqueue is charged so that it is held for the whole
      operation") -- would watch intake_bridge.ACCEPT_COMMAND for the host's
      ack and never see it complete there; the ack always fires one state
      later, in FORWARD_TO_ARBITRATION, exactly the class of drift
      completion_ip.template.yaml's own completion_queue_if.notes records
      having happened once already ("wait point used to name EMIT while this
      note named STALL_OUTPUT, and the two could not both be true").
  - id: M6
    class: scenario_gap
    severity: medium
    claim: >-
      test_scenarios[2]'s expected_performance_properties names
      no_output_stall_below_the_backlog_limit, but the test named for that
      scenario never drives or checks a case where the backlog stays below
      the configured limit; it only exercises reaching and then draining the
      limit.
    template: >-
      templates/storage_pipeline_subsystem.template.yaml lines 261-266,
      test_scenarios[2] completion_backlog_throttles_arbitration_issue_readiness:
      "expected_performance_properties: [no_output_stall_below_the_backlog_limit]".
    model: >-
      tests/test_storage_pipeline_subsystem.py lines 180-208,
      test_completion_backlog_throttles_arbitration_issue_readiness: submits
      5 commands against completion_backlog_limit=2 with completion held
      not-ready from the start, so the backlog is at or above the limit for
      the entire first phase of the test; it asserts issue_throttled becomes
      True and later False, but no assertion anywhere in the file checks
      that arbitration.output_ready (or issue_throttled) stays True/False
      while the backlog is genuinely below the configured limit.
    why: >-
      The scenario's stated performance property -- that issue readiness is
      not disturbed while the backlog has not reached the limit -- is left
      unverified; a regression that throttled issue readiness prematurely
      (e.g. an off-by-one in the >= comparison, or a monitor that throttles
      on any nonzero backlog) would pass every test in this file while
      silently violating a property the template claims this scenario
      covers.
