findings:
  - id: M40
    class: fsm_structure
    severity: high
    claim: >-
      _has_actionable_work only excludes SQs already claimed in inflight_sqs; it does not
      exclude SQs whose only pending tenant is permanently ineligible (tenant_alive false,
      or otherwise never self-clearing), so IDLE's wait never actually blocks for that
      candidate. The arbiter instead retakes the declared IDLE -> PORT_SCAN -> TENANT_SCAN
      -> STALL -> IDLE cycle forever, contradicting STALL -> IDLE's declared
      returns_to_the_wait semantics and the documented invariant that an idle arbiter
      "costs nothing and records nothing".
    template: >-
      templates/arbitration_ip.template.yaml arbiter_main transitions: STALL -> IDLE
      (condition returns_to_the_wait, line 157-161) and IDLE's own description "Wait for
      queue activity or downstream availability" (line 102-103); performance_model.metrics
      declares stalls/no_tenant_pending_stalls (line 423) as meaningful counters, not an
      unbounded polling artifact.
    model: >-
      src/ip_model_automation/arbitration_ip.py:286-313 (_has_actionable_work, keys only on
      inflight_sqs, never on tenant_credit/tenant_alive) and the IDLE loop at
      arbitration_ip.py:481-491 that blocks on _arbiter_wake only while
      _has_actionable_work() is false. Verified empirically on a scratch run: enqueuing one
      command for a tenant with tenant_alive=False (matching
      tests/test_arbitration_ip.py:459-468's test_arbitration_dead_tenant_does_not_trigger_a_refill
      setup, which asserts only credit_refills==0 and issued==[] and never checks stalls)
      gives metrics["stalls"] == 37 at t=300, 124 at t=1000, 374 at t=3000 -- growing
      linearly and unboundedly instead of the arbiter genuinely blocking in IDLE.
    why: >-
      A permanently ineligible tenant's queued work should leave the arbiter genuinely
      idle (as the fixed-for-inflight case in round six/seven already does for
      already-granted candidates) rather than repeatedly paying real declared port_scan +
      tenant_scan + backpressure_retry cycles and inflating stall metrics without bound.
      Any consumer reading stalls/no_tenant_pending_stalls as arbitration-event counts
      (their declared purpose) is misled, and the simulated timing of a run containing a
      dead tenant is wrong: cycles are spent scanning and stall counters accumulate for a
      candidate the model itself has already determined can never be granted until an
      external tenant_alive change, exactly the class of waste this stage's own history
      (re-scanning a candidate that cannot proceed) was created to catch.
