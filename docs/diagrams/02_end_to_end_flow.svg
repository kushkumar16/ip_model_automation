<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1150" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea4335"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34a853"/>
    </marker>
  </defs>
  <rect width="980" height="1150" fill="#ffffff"/>
  <text x="490" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#202124">End-to-end flow: from DLD to validated model + tests</text>

  <!-- DLD input -->
  <rect x="310" y="70" width="360" height="54" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="490" y="103" text-anchor="middle" font-size="16" font-weight="bold" fill="#174ea6">dlds/&lt;ip&gt;_dld.md</text>

  <!-- Stage 0 band -->
  <rect x="40" y="160" width="900" height="490" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/>
  <text x="60" y="190" font-size="16" font-weight="bold" fill="#5f6368">STAGE 0 — DLD to reviewed template</text>

  <rect x="310" y="210" width="360" height="54" rx="10" fill="#ffffff" stroke="#5f6368" stroke-width="1.5"/>
  <text x="490" y="243" text-anchor="middle" font-size="15" fill="#202124">tools/dld_to_template.py (extractor)</text>

  <rect x="310" y="300" width="360" height="64" rx="10" fill="#ffffff" stroke="#5f6368" stroke-width="1.5"/>
  <text x="490" y="326" text-anchor="middle" font-size="14" fill="#202124">draft template (with TODO_REVIEW markers)</text>
  <text x="490" y="348" text-anchor="middle" font-size="14" fill="#202124">+ gaps report (reports/&lt;ip&gt;.gaps.md)</text>

  <rect x="310" y="400" width="360" height="64" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="490" y="426" text-anchor="middle" font-size="14" fill="#174ea6">Human / LLM resolves every TODO_REVIEW</text>
  <text x="490" y="448" text-anchor="middle" font-size="13" fill="#174ea6">(using only DLD-stated behavior)</text>

  <rect x="310" y="500" width="360" height="64" rx="10" fill="#fff4e5" stroke="#f5a623" stroke-width="2"/>
  <text x="490" y="526" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a6400">GATE: template_lint.py</text>
  <text x="490" y="548" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a6400">+ check_template_coverage.py --strict</text>

  <rect x="310" y="590" width="360" height="44" rx="10" fill="#fff4e5" stroke="#f5a623" stroke-width="2"/>
  <text x="490" y="618" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a6400">templates/&lt;ip&gt;.template.yaml (golden)</text>

  <!-- Stage 1 band -->
  <rect x="40" y="680" width="900" height="360" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/>
  <text x="60" y="710" font-size="16" font-weight="bold" fill="#5f6368">STAGE 1 — Template to model + tests</text>

  <rect x="130" y="730" width="340" height="54" rx="10" fill="#ffffff" stroke="#5f6368" stroke-width="1.5"/>
  <text x="300" y="755" text-anchor="middle" font-size="14" fill="#202124">generate_model_scaffold.py</text>
  <text x="300" y="774" text-anchor="middle" font-size="13" fill="#5f6368">(SimPy skeleton: one process per FSM)</text>

  <rect x="510" y="730" width="340" height="54" rx="10" fill="#ffffff" stroke="#5f6368" stroke-width="1.5"/>
  <text x="680" y="755" text-anchor="middle" font-size="14" fill="#202124">generate_prompt_pack.py</text>
  <text x="680" y="774" text-anchor="middle" font-size="13" fill="#5f6368">(self-contained LLM prompt)</text>

  <rect x="310" y="820" width="360" height="64" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="490" y="846" text-anchor="middle" font-size="14" fill="#174ea6">Implement model + tests from template only</text>
  <text x="490" y="868" text-anchor="middle" font-size="13" fill="#174ea6">src/…/&lt;ip&gt;.py + tests/test_&lt;ip&gt;.py</text>

  <rect x="310" y="920" width="360" height="54" rx="10" fill="#fff4e5" stroke="#f5a623" stroke-width="2"/>
  <text x="490" y="943" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a6400">GATE: validate_dld_flow.py</text>
  <text x="490" y="963" text-anchor="middle" font-size="13" fill="#9a6400">(lint · coverage · scaffold · unit tests)</text>

  <!-- Done -->
  <rect x="310" y="1070" width="360" height="54" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="490" y="1103" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e7e34">DONE: validated model + passing tests</text>

  <!-- Main flow arrows -->
  <line x1="490" y1="124" x2="490" y2="205" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="264" x2="490" y2="295" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="364" x2="490" y2="395" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="464" x2="490" y2="495" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="564" x2="490" y2="585" stroke="#34a853" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="510" y="580" font-size="12" fill="#1e7e34">pass</text>

  <!-- Gate fail loop (stage 0) -->
  <path d="M 310 532 L 200 532 L 200 432 L 305 432" fill="none" stroke="#ea4335" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowRed)"/>
  <text x="192" y="487" text-anchor="end" font-size="12" fill="#ea4335">fail: keep fixing</text>

  <!-- Template to scaffold + pack -->
  <path d="M 490 634 L 490 660 L 300 660 L 300 725" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 490 634 L 490 660 L 680 660 L 680 725" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- scaffold/pack to implement -->
  <path d="M 300 784 L 300 852 L 305 852" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 680 784 L 680 852 L 675 852" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="490" y1="884" x2="490" y2="915" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Gate fail loop (stage 1) -->
  <path d="M 310 947 L 200 947 L 200 852 L 305 852" fill="none" stroke="#ea4335" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowRed)"/>
  <text x="192" y="905" text-anchor="end" font-size="12" fill="#ea4335">fail: fix + retry</text>

  <line x1="490" y1="974" x2="490" y2="1065" stroke="#34a853" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="510" y="1030" font-size="12" fill="#1e7e34">pass</text>
</svg>
