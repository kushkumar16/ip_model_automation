findings:
  - id: M38
    class: timing_mismatch
    severity: high
    claim: >-
      accept's BACKPRESSURE -> READY transition is declared latency_cycles: 0
      but the model charges a full retry_latency cycle for it.
    template: >-
      templates/completion_ip.template.yaml fsm_processes[accept].transitions,
      the BACKPRESSURE -> READY entry (condition queue_space_available,
      actions: [], latency_cycles: 0) -- the only transition in this FSM
      declared at 0 cycles, against 1 for every other accept transition.
    model: >-
      src/ip_model_automation/completion_ip.py:203-212, inside
      accept_process(): once the pending-queue-full while loop exits, the
      model sets fsm_state["accept"] = "READY" and then does
      `yield self.env.timeout(self.retry_latency)` (line 212) before moving on
      to ENQUEUE, charging retry_latency (default 1, non-zero) cycles to a
      transition the template declares free.
    why: >-
      Verified by instrumenting the model directly (pending_depth=1,
      retry_latency=3): a command backpressured at t=2 that has queue space
      restored is observed entering READY at t=5 and ENQUEUE only at t=8 --
      the full retry_latency (3 cycles) is spent sitting in READY before the
      enqueue even starts, though the template says this transition itself
      costs nothing. Every recovery from BACKPRESSURE is delayed by one extra
      retry_latency cycle beyond what the declared FSM timing says, and a
      caller timing the accept path against the template would be off by
      exactly that amount. A `yield self.env.timeout(0)` would have made the
      READY state observable (the actual bug this code's own comment says it
      was fixing) without spending the cycle the template declares this
      transition does not cost.
  - id: M39
    class: fsm_structure
    severity: high
    claim: >-
      completion_scheduler's WAIT_TOKENS -> SELECT_TENANT transition is
      declared on condition next_dispatch_tick_or_refill, tied to
      qos.dispatch_tick_ms; the model never implements a dispatch-tick
      condition at all and instead retakes the transition after a fixed
      retry_latency cycle every time.
    template: >-
      templates/completion_ip.template.yaml fsm_processes[completion_scheduler].
      transitions, the WAIT_TOKENS -> SELECT_TENANT entry (condition
      next_dispatch_tick_or_refill), read together with qos.dispatch_tick_ms:
      1 (ms) and resources[completion_output_port].bandwidth:
      one_completion_per_dispatch_tick.
    model: >-
      src/ip_model_automation/completion_ip.py:409-416, inside
      completion_scheduler(): on a token stall the model does
      `yield self.env.timeout(self.retry_latency)` then `continue`, retrying
      the select on a fixed cycle-level cadence (retry_latency defaults to 1
      cycle / 2ns). Neither `dispatch_tick_ms` nor any 1ms-scale timeout
      appears anywhere in the file (grep confirms no reference), so nothing in
      the model corresponds to "next dispatch tick" at all -- only "or
      refill" is even partially honoured, via configure_tenant/credit_tokens
      refreshing eligibility, and that path does not go through this
      transition either since a token-sufficient tenant becoming eligible
      wakes the scheduler from IDLE, not from WAIT_TOKENS.
    why: >-
      qos.dispatch_tick_ms (1ms = 500,000 cycles at the declared 500MHz/2ns
      clock) is a real, distinct parameter from window_ms (which the model
      does faithfully implement as refill_window = 5,000,000 cycles = 10ms,
      matching qos.window_ms: 10). Its complete absence here means a
      token-starved tenant is re-polled roughly 500,000x more often than the
      declared dispatch-tick cadence implies, so token_stalls counts and the
      simulated recovery timing after a partial-token stall are governed
      entirely by retry_latency, a knob the template never associates with
      this transition, rather than by anything resembling
      next_dispatch_tick_or_refill.
