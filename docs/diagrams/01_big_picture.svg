<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="1180" height="430" fill="#ffffff"/>
  <text x="590" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#202124">The big picture: DLD in, validated model + tests out</text>

  <!-- DLD -->
  <rect x="40" y="150" width="270" height="120" rx="12" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="175" y="200" text-anchor="middle" font-size="18" font-weight="bold" fill="#174ea6">DLD markdown</text>
  <text x="175" y="228" text-anchor="middle" font-size="14" fill="#174ea6">(inconsistent, incomplete)</text>

  <!-- Template -->
  <rect x="460" y="150" width="270" height="120" rx="12" fill="#fff4e5" stroke="#f5a623" stroke-width="2"/>
  <text x="595" y="200" text-anchor="middle" font-size="18" font-weight="bold" fill="#9a6400">Template YAML</text>
  <text x="595" y="228" text-anchor="middle" font-size="14" fill="#9a6400">(golden reference)</text>

  <!-- Model -->
  <rect x="880" y="85" width="260" height="95" rx="12" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="1010" y="127" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e7e34">SimPy model</text>
  <text x="1010" y="153" text-anchor="middle" font-size="13" fill="#1e7e34">src/ip_model_automation/&lt;ip&gt;.py</text>

  <!-- Tests -->
  <rect x="880" y="245" width="260" height="95" rx="12" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="1010" y="287" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e7e34">Unit tests</text>
  <text x="1010" y="313" text-anchor="middle" font-size="13" fill="#1e7e34">tests/test_&lt;ip&gt;.py</text>

  <!-- Arrows -->
  <line x1="310" y1="210" x2="452" y2="210" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="381" y="196" text-anchor="middle" font-size="13" fill="#5f6368">extract + review</text>

  <line x1="730" y1="185" x2="872" y2="140" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="140" text-anchor="middle" font-size="13" fill="#5f6368">generate + implement</text>

  <line x1="730" y1="235" x2="872" y2="285" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="290" text-anchor="middle" font-size="13" fill="#5f6368">test scenarios</text>

  <line x1="1010" y1="180" x2="1010" y2="245" stroke="#34a853" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1078" y="217" text-anchor="middle" font-size="12" fill="#1e7e34">validate</text>

  <text x="590" y="395" text-anchor="middle" font-size="14" fill="#5f6368">The DLD authors the template; the reviewed template generates everything else. Missing details are flagged, never invented.</text>
</svg>
