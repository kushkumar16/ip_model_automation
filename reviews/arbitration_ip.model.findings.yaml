findings:
  - id: M42
    class: scenario_gap
    severity: low
    claim: >-
      The weighted_order_four_tenants test_scenario's declared
      expected_performance_properties: [no_output_stall] is never checked by
      the test written for it, and no other test in the suite covers a
      sustained multi-tenant weighted-load configuration for this property
      either.
    template: >-
      templates/arbitration_ip.template.yaml test_scenarios[0]
      (weighted_order_four_tenants), expected_performance_properties:
      [no_output_stall]
    model: >-
      tests/test_arbitration_ip.py
      test_arbitration_weighted_order_across_four_tenants (its docstring
      names this scenario by name: "The weighted_order_four_tenants
      scenario, which no test drove"); it and its helper
      _four_tenant_sequence (lines ~138-173) assert only selection_trace
      tenant order and never read model.metrics["output_stalls"] or
      model.metrics["output_backpressure_cycles"]. The only two assertions
      on output_backpressure_cycles in the whole file are in
      test_arbitration_downstream_backpressure_holds_selected_sq and
      test_arbitration_issue_ready_dropping_during_the_request_holds_the_command
      (lines 312 and 985), both single-tenant backpressure scenarios
      unrelated to this one.
    why: >-
      A reader relying on test_scenarios to know what the suite verifies
      would believe the no-stall claim for this weighted, multi-tenant,
      multi-port scenario had been checked; it has not. The underlying
      behaviour is very likely correct (issue_ready is never lowered in
      this test), so this does not look like a live bug, but it is exactly
      the kind of declared-but-unexercised property this stage exists to
      surface, and the same repo's own test history shows this class of gap
      (a declared expected_performance_property nothing checked) has been
      treated as worth a dedicated fix before, e.g. the timing assertions
      later added in test_arbitration_charges_its_declared_latencies_at_defaults
      and test_arbitration_issue_pipeline_charges_its_declared_latencies.
