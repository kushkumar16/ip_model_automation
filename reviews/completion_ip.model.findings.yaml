model_sha256: 64d71c55dadcfa0c50210a5b495333bc3c2b07086d36b81c1787dd47b6d121cb
tests_sha256: 9350caf4ea4269b18f043620bd712ff399f54897dd453b0f729e350f140273d0
findings:
  - id: M24
    class: fsm_structure
    severity: medium
    claim: >-
      `IDLE -> SELECT_TENANT` is declared on the condition `any_pending_command`, and the
      scheduler now takes it unconditionally: it re-enters `SELECT_TENANT` and pays the full
      8-cycle `tenant_select` every time it polls an empty queue. The helper that implemented
      the declared condition, `_any_pending_command()`, was deleted outright.
    template: >-
      fsm_processes[completion_scheduler].transitions (templates/completion_ip.template.yaml:115-119):
      `from: IDLE`, `to: SELECT_TENANT`, `condition: any_pending_command`, `actions:
      [load_weighted_tenant_order]`, `latency_cycles: 1`. timing_model.fsm_process_delays[completion_scheduler]
      `{name: tenant_select, cycles: 8, ns: 16}`.
    model: >-
      src/ip_model_automation/completion_ip.py:249-269 — the inner `while True` assigns
      `SELECT_TENANT` at :262 and charges `tenant_select_latency` at :263 before calling
      `_select_tenant()` at :264; only when that returns `None` does it assign `IDLE` at :266
      and wait one `retry_latency` at :268 before looping straight back to :262. The condition's
      former implementation (`_any_pending_command`, round three's :219-222) is deleted.
    why: >-
      Measured with an instrumented `fsm_state` dict recording every assignment against
      `env.now`. With the model at defaults and **no command ever submitted**, the recorded
      scheduler trace over 40 cycles is `t=0 IDLE -> SELECT_TENANT`, `t=8 SELECT_TENANT ->
      IDLE (held 8)`, `t=9 IDLE -> SELECT_TENANT (held 1)`, repeating at t=17/18, 26/27,
      35/36: the declared edge is taken five times in 40 cycles with `self.pending` empty
      throughout, i.e. with `any_pending_command` false on every one of them, and the
      scheduler spends 32 of those 40 cycles inside `SELECT_TENANT` selecting from an empty
      set. This is not a fix that overshot — it is the template disagreeing with itself, which
      is why it is filed rather than corrected: `end_to_end_paths.no_stall_completion`
      (:272-283) says in as many words that "the scheduler pays tenant_select from the top of
      its loop, before it has a candidate", and the model cannot honour that and the
      `any_pending_command` guard at the same time. Round three had the guard and measured 21
      cycles (round-three M16); round four has the note's behaviour and measures 17. A person
      has to decide which of the two template statements is the contract; no model satisfies
      both. Marked interpretive only as to *which side gives*, not as to the fact: the edge is
      demonstrably taken with the declared condition false.
  - id: M25
    class: timing_mismatch
    severity: medium
    claim: >-
      `no_stall_completion: 17 cycles` now holds only for a command submitted at t=0. Because
      the scheduler free-runs, sampling the pending queues only at the instant each 8-cycle
      select ends, the measured end-to-end latency of a single no-stall READ at model defaults
      ranges from 14 to 22 cycles depending on arrival phase — a spread caused by no stall of
      any kind the template declares.
    template: >-
      timing_model.end_to_end_paths.no_stall_completion (templates/completion_ip.template.yaml:268-283):
      `cycles: 17`, `ns: 34`, `path: [tenant_select, token_check, completion_emit]`, note
      "Measured at model defaults: a single READ completes at t=17 ... it is not on the
      critical path for a command arriving into an idle scheduler."
      timing_model.fsm_process_delays[completion_scheduler] `tenant_select` 8, `token_check` 5,
      `completion_emit` 4; `output_stall_retry` 1 is the only declared retry for this FSM.
    model: >-
      src/ip_model_automation/completion_ip.py:262-269 — `SELECT_TENANT` charges
      `tenant_select_latency` *before* `_select_tenant()` reads the queues at :264, so a
      command that lands in `self.pending` (:158) after that read waits the rest of the poll:
      `retry_latency` (:268) plus a further full `tenant_select_latency` (:263).
    why: >-
      Measured by driving one READ into an otherwise empty model at defaults (service 4 /
      select 8 / check 5 / emit 4 / retry 1) and sweeping the submission time, reading
      `model.completed[0][0]`: submit at t=0,1,2,3 completes at t=17 (end-to-end 17, 16, 15,
      14); submit at t=4..12 completes at t=26 (22, 21, 20, 19, 18, 17, 16, 15, 14); submit at
      t=13..18 completes at t=35 (22, 21, ...). Min 14, max 22, mean 17.95 over one phase
      period, against a declared 17 — the figure is the value at phase 0, not a bound in
      either direction, and the 29% worst case is spent in `IDLE`/`SELECT_TENANT` polling
      rather than in any declared stall (`token_stalls`, `output_stalls` and
      `queue_full_stalls` are all zero across the sweep). Attribution confirmed by zeroing the
      other latencies one at a time: with everything else 0 the first completion is at
      t=`tenant_select`=8, `token_check`=6, `emit`=5, `service_latency`=4, all-zero t=1 (one
      idle poll), so the excess is exactly the poll quantum `tenant_select + retry_latency` =
      9. A related edge: the overlap the note relies on holds only while the enqueue finishes
      strictly *before* the select samples — sweeping `service_latency` gives t=17 for 0..7 and
      t=26 for 8, 9, 10, 12, 16, so a declared `enqueue` of 4 against a declared `tenant_select`
      of 8 sits one cycle inside the boundary. Filed as `medium`, not `high`: the one
      measurement the template actually states ("a single READ completes at t=17") is
      reproduced exactly, and what is wrong is the generality a reader will take from a figure
      called an end-to-end path. Interpretive to that extent, and a consequence of M24 — the
      two will probably be ruled together, but they are separable: a person could accept the
      free-running select and still want this figure annotated.
  - id: M26
    class: wait_model_impl
    severity: medium
    claim: >-
      `completion_queue_if` declares its wait point at `completion_scheduler.EMIT`, and EMIT is
      occupied for exactly zero simulated time whenever `cpl_ready` is low — the only
      circumstance in which anything waits on that interface. Unchanged since round three
      (round-three M20): the model, the template and the measurement are all identical.
    template: >-
      interfaces[completion_queue_if].wait_model (templates/completion_ip.template.yaml:48-55):
      mode `wait_for_ack_inline`, requester `this_ip`, `wait_points: [completion_scheduler.EMIT]`,
      `resumes_on: cpl_ready`, and `notes: "while cpl_ready is low the scheduler holds in
      STALL_OUTPUT and the completion stays queued"`. fsm_relationships.gating_relationships:
      `completion_queue_if.cpl_ready` gates `completion_scheduler.EMIT`.
      fsm_processes[completion_scheduler]: `EMIT -> STALL_OUTPUT`, condition `output_not_ready`,
      latency_cycles 1.
    model: >-
      src/ip_model_automation/completion_ip.py:284 `self.fsm_state["completion_scheduler"] =
      "EMIT"` is followed immediately by `while not self.output_ready:` at :285 and
      `= "STALL_OUTPUT"` at :288 with no yield between; the loop re-assigns `EMIT` at :292 and
      re-tests at :285, overwriting it again with no yield.
    why: >-
      Re-measured this round with the instrumented `fsm_state`, defaults, `cpl_ready` low from
      t=0 and raised at t=24: `t=13 CHECK_TOKENS -> EMIT (held 5)`, `t=13 EMIT -> STALL_OUTPUT
      (held 0)`, then `STALL_OUTPUT -> EMIT (held 1)` / `EMIT -> STALL_OUTPUT (held 0)` at
      t=14..23. Total occupancy over the run: STALL_OUTPUT 11 cycles, EMIT 4 — and those 4 are
      the successful emit after the stall cleared, so EMIT is occupied for 0 cycles of the 11
      the requester actually waits. Mutation-tested on a fresh copy of the repo
      (`PYTHONDONTWRITEBYTECODE=1`, `__pycache__` cleared, edit asserted present on disk before
      running): deleting the `EMIT` assignment at :284 entirely, so the model never names the
      declared wait point before stalling, leaves all 18 tests passing — nothing observes it.
      `tools/check_wait_model_coverage.py` still reports "OK (2 models assign every declared
      wait point)" because it reads the assignment, not the occupancy, and
      `check_declared_transitions.py` reports "0 declared states never observably occupied"
      because EMIT *is* occupied on the no-stall path. **Still flagged as possibly a template
      fix rather than a model fix:** the same interface's `notes` name `STALL_OUTPUT`, which is
      what the model does, so the template names two different states for the same wait and no
      model can satisfy both as written. Awaiting the human ruling; re-filed unchanged.
  - id: M27
    class: fsm_structure
    severity: medium
    claim: >-
      `SELECT_TENANT -> IDLE` is a transition the template does not declare, and the scheduler
      takes it on every poll that finds no candidate. This is the surviving half of round-three
      M19; the other half (IDLE occupied for zero simulated time) is genuinely fixed.
    template: >-
      fsm_processes[completion_scheduler].transitions (templates/completion_ip.template.yaml:114-152)
      declares exactly one edge touching `IDLE`: `IDLE -> SELECT_TENANT`. No transition *into*
      `IDLE` is declared from any state, and `SELECT_TENANT` has one declared exit
      (`SELECT_TENANT -> CHECK_TOKENS` on `candidate_found`), so it is not a state the template
      left open.
    model: >-
      src/ip_model_automation/completion_ip.py:265-269 — `if tenant_id is None:` assigns
      `self.fsm_state["completion_scheduler"] = "IDLE"` at :266 directly from `SELECT_TENANT`.
    why: >-
      Reproduced `python tools/check_declared_transitions.py completion_ip` (`UNDECLARED
      completion_scheduler: SELECT_TENANT -> IDLE`) from my own instrumented traces rather than
      from its output: with one READ at defaults the recorded scheduler changes are `t=17 EMIT
      -> SELECT_TENANT`, `t=25 SELECT_TENANT -> IDLE (held 8)`, `t=26 IDLE -> SELECT_TENANT
      (held 1)`, and the same pair repeats every 9 cycles for as long as the model runs. The
      zero-width half of round-three M19 is fixed and I confirm it: `IDLE` is now held for
      `retry_latency` on every one of those passes (`held 1` above, never `held 0`), and the
      round-three `EMIT -> IDLE` edge is gone — the tool reports it no longer, and no trace I
      recorded contains it. What remains is that the one state the template gives no entry to
      is entered, now visibly, on every idle poll. Severity kept at `medium` rather than
      lowered: unlike round three the state is observable, so the divergence is now a plain
      structural one a reader can see. Note that no test pins it either way — mutation-tested
      on a fresh copy, deleting the `IDLE` assignment at :266 so the scheduler never leaves
      `SELECT_TENANT` leaves all 18 tests passing. Unchanged in substance since round three;
      awaiting the human ruling.
  - id: M28
    class: fsm_structure
    severity: low
    claim: >-
      `accept` never takes the declared `BACKPRESSURE -> READY` transition; when queue space
      appears it goes straight from `BACKPRESSURE` to `ENQUEUE`, an edge the template does not
      declare, and the test that claims to check the resumption cannot tell the two apart.
      Unchanged since round three (round-three M21) — `accept_process` was not touched.
    template: >-
      fsm_processes[accept].transitions (templates/completion_ip.template.yaml:86-106):
      `BACKPRESSURE -> READY`, condition `queue_space_available`, actions `[]`, latency_cycles 0;
      `READY -> ENQUEUE`, condition `incoming_valid_and_queue_space`, actions `[enqueue_command]`,
      latency_cycles 1. No `BACKPRESSURE -> ENQUEUE` edge is declared.
    model: >-
      src/ip_model_automation/completion_ip.py:144-156 — the `while self._pending_queue_full(...)`
      loop at :144 sets `BACKPRESSURE` at :145 and, when the condition clears, falls through
      directly to `self.fsm_state["accept"] = "ENQUEUE"` at :156 without passing through
      `READY`, which is only assigned at the top of the outer loop (:136).
    why: >-
      Re-measured from an instrumented trace, `pending_depth=1`, zero-token tenant, two
      commands, `pending` cleared at t=40: `t=0 READY -> ENQUEUE`, `t=1 ENQUEUE -> READY`,
      `t=1 READY -> BACKPRESSURE`, `BACKPRESSURE -> BACKPRESSURE` once per retry cycle from
      t=2 to t=39, then `t=40 BACKPRESSURE -> ENQUEUE`, `t=41 ENQUEUE -> READY`. `READY` is
      never entered between the stall clearing and the enqueue. Timing is unaffected (the
      declared edge costs 0 cycles), hence `low`. It matters because
      tests/test_completion_ip.py:165-169 asserts it *is* taken — the comment reads "Space
      appears, and accept resumes -- BACKPRESSURE -> READY" while the assertion
      `assertEqual(model.fsm_state["accept"], "READY")` runs at t=80 and observes the READY
      written at :136 one full enqueue after the resumption it claims to witness.
      Mutation-tested on a fresh copy: inserting the declared `BACKPRESSURE -> READY` hop
      before the enqueue leaves all 18 tests passing, so the assertion is satisfied by both the
      declared path and the undeclared one. Unchanged since round three; awaiting the human
      ruling.
  - id: M29
    class: fsm_structure
    severity: low
    claim: >-
      `accept.RESET` is never entered and the declared `RESET -> READY` transition is never
      taken; the model implements no reset of any kind, so the declared reset behaviour (clear
      pending queues, tokens and metrics) is unmodelled. Unchanged since round three
      (round-three M23).
    template: >-
      fsm_processes[accept] (templates/completion_ip.template.yaml:85-91): `states: [RESET,
      READY, ENQUEUE, BACKPRESSURE]`, transition `RESET -> READY`, condition `reset_deasserted`,
      actions `[clear_pending_queues]`, latency_cycles 1. ip.reset
      (templates/completion_ip.template.yaml:8-10): `type: sync`, `behavior:
      clear_pending_queues_tokens_and_metrics`.
    model: >-
      src/ip_model_automation/completion_ip.py:74-78 — the constructor initialises
      `fsm_state["accept"]` to `"READY"`, and `accept_process` (:134-169) begins by assigning
      `"READY"` at :136. No code path assigns `"RESET"` and there is no reset API
      (`functionality_model.apis` does not list one either).
    why: >-
      Confirmed mechanically this round rather than by eye: a regex over every
      `fsm_state[...] = "..."` in the model yields exactly thirteen (fsm, state) pairs —
      accept {READY, ENQUEUE, BACKPRESSURE}, completion_scheduler {IDLE, SELECT_TENANT,
      CHECK_TOKENS, WAIT_TOKENS, EMIT, STALL_OUTPUT}, refill {WAIT_WINDOW, ASSESS_USAGE,
      REFILL_BASE, PUBLISH_METRICS} — and the string "RESET" does not occur anywhere in the
      file, nor does any attribute of `CompletionIpModel` contain "reset". `RESET` appears in
      none of the traces I recorded this round (idle model, single command, two commands,
      token starvation, output backpressure, inactive tenant, `pending_depth=1` backpressure,
      refill process). Reproduces `tools/check_declared_transitions.py completion_ip`'s `NEVER
      TAKEN accept: RESET -> READY`. **Still flagged as the weakest finding here and possibly a
      template fix:** starting a model in the post-reset state is a defensible abstraction, and
      `completion_scheduler.RESET` is declared with no exit at all so the template constrains
      nothing there. It is filed because for `accept` the template does declare the exit, with
      an action and a latency, and nothing in the model corresponds to any of it. Unchanged
      since round three; awaiting the human ruling.
