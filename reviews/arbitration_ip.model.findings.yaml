model_sha256: a3125e19382d056d2378e0ef3299ef07018c0adbc3f29e70457e9023b85a7580
tests_sha256: ec43a6128411339396fc927fc7c23f985f51ffd2ad5436012577d7036ba50f38
findings:
  - id: M41
    class: fsm_structure
    severity: high
    claim: >-
      When TENANT_SCAN's weighted-order pick for a port is a tenant whose only
      pending SQ(s) are already claimed in inflight_sqs, SQ_SCAN's failure for
      that one tenant marks the *entire port* tried for the rest of the sweep
      (arbiter_main.py's outer loop) instead of trying a different, actually
      eligible tenant on the same port -- so a genuinely grantable tenant can
      be starved indefinitely behind another tenant's stalled in-flight SQ,
      even while _has_actionable_work() correctly reports that real work
      exists the whole time.
    template: >-
      templates/arbitration_ip.template.yaml:132-136 declares
      "TENANT_SCAN -> SQ_SCAN, condition: eligible_tenant_found", and
      templates/arbitration_ip.template.yaml:152-156 declares
      "SQ_SCAN -> STALL, condition: no_eligible_sq" as the failure edge for
      one candidate tenant, not for the whole port; qos.weights
      (templates/arbitration_ip.template.yaml:315-318) assigns unequal
      per-tenant weights to tenants that share a port (e.g. port0's T0 and
      T1), so a port-level FSM whose "no_eligible_sq" for its top-weighted
      tenant permanently forecloses that port's other, lower-weighted but
      genuinely eligible tenants is not what the declared per-candidate
      hierarchy (qos.hierarchy: [port, tenant, sq]) describes.
    model: >-
      src/ip_model_automation/arbitration_ip.py:366-378 (_select_tenant picks
      a tenant using only tenant_pending_bitmap and credit eligibility, with
      no check that the tenant has any non-inflight SQ) together with
      src/ip_model_automation/arbitration_ip.py:587-590 (`if sq_id is None:
      tried_ports.add(port_id); yield from self._stall(...); continue` --
      this marks the whole port tried and never retries _select_tenant for a
      different tenant of the same port, and never resets tried_ports even
      when this was the only pending port, unlike the analogous
      "tenant_id is None" branch a few lines above it).
    why: >-
      Reproduced empirically: with weights={"T0": 4, "T1": 1} on a single
      port, enqueue one T0/SQ0 command while issue_ready is held false (so
      once granted, (T0, SQ0) sits in inflight_sqs, unresolved, for a long
      bounded window), then enqueue a second T0/SQ0 command and a fully
      independent, fully-eligible T1/SQ0 command on the same port. Because
      T0's weighted-round-robin pointer only advances on an actual grant (via
      policy_update), and T0 was never actually re-granted (SQ_SCAN keeps
      failing for it), TENANT_SCAN keeps re-selecting T0 every sweep. Over a
      390-cycle window the model recorded grants stuck at 1 (only the
      original T0 grant), stalls climbing to 26 (13 no_sq_pending_stalls, 13
      no_port_pending_stalls) from the repeating
      PORT_SCAN -> TENANT_SCAN(T0) -> SQ_SCAN(fail) -> STALL ->
      PORT_SCAN(fails, port already tried) -> STALL cycle, and T1's command
      was never even looked at by TENANT_SCAN -- despite
      model._has_actionable_work() correctly returning True the entire time
      (it does exclude in-flight SQs from "actionable", but that exclusion
      never reaches _select_tenant/_select_sq's per-sweep candidate choice).
      T1 was granted only once T0's in-flight SQ finally cleared externally.
      A weighted arbiter that can indefinitely starve one fully-eligible
      tenant behind a different tenant's stalled in-flight SQ, on the very
      same port, is simulating the wrong arbitration outcome for exactly the
      qos.weights/qos.hierarchy this template declares.
