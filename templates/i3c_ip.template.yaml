ip:
  name: i3c_ip
  domain: soc_peripheral
  description: MIPI I3C master controller with a queued command engine, a bit-level SDR transfer engine, an in-band-interrupt (IBI) engine, and masked interrupts.
  clock_domains:
    - name: bus_clk
      frequency_mhz: 500
  reset:
    type: sync
    behavior: clear_queues_config_status_and_irqs

interfaces:
  - name: register_if
    type: apb_axi_lite
    direction: input
    clock_domain: bus_clk
    wait_model:
      mode: wait_for_response
      requester: peer
      wait_points: [register_access.READ_STATUS]
      resumes_on: register_access_complete
      timeout: indefinite
      response_used_for: "software consumes `read_data` (status, RX bytes, IBI payload) before its next access"
      source: dld
      notes: "configuration and command writes are acknowledged in place as shadow state updates"
    transactions:
      - name: i3c_cfg_access
        fields: [addr, write_data, read_data]
        handshake: valid_ready
        timing_notes: command and config writes update shadow state before a transfer starts
  - name: i3c_bus_if
    type: i3c_open_drain_serial
    direction: output
    clock_domain: bus_clk
    wait_model:
      mode: wait_for_response
      requester: this_ip
      wait_points: [command_engine.WAIT_ACK, bit_transfer_engine.CHECK_ACK]
      resumes_on: target_ack_or_nack
      timeout: indefinite
      response_used_for: "the ACK/NACK and the returned read bytes decide whether the transfer dispatches, aborts, or is captured"
      source: dld
    transactions:
      - name: bit_transfer
        fields: [scl, sda, direction]
        handshake: serial_shift
        timing_notes: each bit takes one SDR bit period; open-drain during address/IBI arbitration, push-pull during data
  - name: interrupt_if
    type: interrupt
    direction: output
    clock_domain: bus_clk
    wait_model:
      mode: wait_for_ack_before_next_request
      requester: this_ip
      wait_points: [interrupt_control.WAIT_SW_CLEAR]
      resumes_on: software_clear
      outstanding_limit: 1
      source: dld
      notes: "the transfer pipeline does not block on the interrupt; the clear must be seen before the next interrupt is asserted"
    transactions:
      - name: i3c_irq
        fields: [irq_vector, irq_level]
        handshake: level
        timing_notes: asserted until software clears status

commands:
  - name: CONFIGURE_INTERRUPT_MASK
    description: Software programs the interrupt mask applied to transfer-done, NACK, and IBI-received events.
    fields: [masked]
    valid_conditions: [register_access_valid]
    completion_conditions: [config_applied]
    error_conditions: []
    functional_effects: [update_interrupt_mask]
    timing_effects: [register_decode_delay]
  - name: QUEUE_COMMAND
    description: Software queues a private read or write transfer command for the command engine.
    fields: [cmd_id, direction, byte_count]
    valid_conditions: [command_queue_has_space]
    completion_conditions: [command_dispatched]
    error_conditions: [command_queue_full]
    functional_effects: [enqueue_command]
    timing_effects: [register_decode_delay]
  - name: WRITE_TX
    description: Software pushes a byte into the TX data queue for a pending write command.
    fields: [byte]
    valid_conditions: [tx_queue_has_space]
    completion_conditions: [byte_enqueued]
    error_conditions: [tx_queue_full]
    functional_effects: [enqueue_tx_byte]
    timing_effects: [register_decode_delay]
  - name: READ_RX
    description: Software reads a byte captured by a completed read command.
    fields: []
    valid_conditions: [rx_queue_non_empty]
    completion_conditions: [byte_returned]
    error_conditions: [rx_queue_empty]
    functional_effects: [dequeue_rx_byte]
    timing_effects: [register_decode_delay]
  - name: READ_IBI
    description: Software reads a captured IBI payload byte.
    fields: []
    valid_conditions: [ibi_queue_non_empty]
    completion_conditions: [byte_returned]
    error_conditions: [ibi_queue_empty]
    functional_effects: [dequeue_ibi_byte]
    timing_effects: [register_decode_delay]
  - name: CLEAR_INTERRUPT
    description: Software clears transfer-done, NACK, and IBI-received interrupt status.
    fields: []
    valid_conditions: [register_access_valid]
    completion_conditions: [interrupt_cleared]
    error_conditions: []
    functional_effects: [clear_interrupt_status]
    timing_effects: [register_decode_delay]

fsm_processes:
  - name: register_access
    purpose: Accept software reads/writes, queue commands and TX bytes, and serve RX/IBI queue reads.
    simpy_process: true
    states: [RESET, IDLE, DECODE_ACCESS, WRITE_CONFIG, READ_STATUS, ACCESS_ERROR]
    transitions:
      - from: IDLE
        to: DECODE_ACCESS
        condition: bus_valid
        actions: [decode_register]
        latency_cycles: 2
      - from: DECODE_ACCESS
        to: WRITE_CONFIG
        condition: is_command_or_data_write
        actions: [enqueue_command_or_data]
        latency_cycles: 2
    functional_responsibilities: [queue_commands, load_tx_queue, serve_rx_and_ibi_reads]
    interfaces_touched: [register_if]
    queues_used: [command_queue, tx_byte_queue, rx_byte_queue, ibi_queue]
    resources_used: [register_bus_port]
  - name: command_engine
    purpose: Pull the next queued command, arbitrate for the bus, and start a transfer with the target dynamic address.
    simpy_process: true
    states: [IDLE, ARBITRATE_BUS, ISSUE_START, SEND_ADDRESS, WAIT_ACK, DISPATCH_TRANSFER]
    transitions:
      - from: IDLE
        to: ARBITRATE_BUS
        condition: command_queue_non_empty
        actions: [request_bus]
        latency_cycles: 1
      - from: ARBITRATE_BUS
        to: ISSUE_START
        condition: bus_won
        actions: [issue_start]
        latency_cycles: 1
      - from: SEND_ADDRESS
        to: WAIT_ACK
        condition: address_sent
        actions: [sample_address_ack]
        latency_cycles: 1
    functional_responsibilities: [arbitrate_bus, address_target, dispatch_transfer_bytes]
    interfaces_touched: [i3c_bus_if]
    queues_used: [command_queue, tx_byte_queue, shift_queue]
    resources_used: [i3c_bus_port]
  - name: bit_transfer_engine
    purpose: Shift address and data bits over SCL/SDA and sample ACK/NACK.
    simpy_process: true
    states: [IDLE, SHIFT_BIT, SAMPLE_BIT, BYTE_COMPLETE, CHECK_ACK, ISSUE_STOP]
    transitions:
      - from: IDLE
        to: SHIFT_BIT
        condition: transfer_dispatched
        actions: [drive_sda_bit]
        latency_cycles: 1
      - from: SHIFT_BIT
        to: BYTE_COMPLETE
        condition: all_bits_shifted
        actions: [capture_or_release_byte]
        latency_cycles: 1
      - from: BYTE_COMPLETE
        to: CHECK_ACK
        condition: byte_complete
        actions: [sample_ack]
        latency_cycles: 1
    functional_responsibilities: [serialize_byte, sample_ack_nack]
    interfaces_touched: [i3c_bus_if]
    queues_used: [shift_queue, rx_byte_queue, interrupt_pending_queue]
    resources_used: [i3c_bus_port]
  - name: ibi_engine
    purpose: Detect an in-band interrupt request during a bus-idle window, arbitrate it onto the bus, ACK it, and capture the IBI payload byte.
    simpy_process: true
    states: [IDLE, DETECT_REQUEST, ARBITRATE_IBI, ACK_IBI, READ_IBI_BYTE, NACK_IBI]
    transitions:
      - from: IDLE
        to: DETECT_REQUEST
        condition: bus_idle
        actions: [sample_sda_for_request]
        latency_cycles: 1
      - from: DETECT_REQUEST
        to: ARBITRATE_IBI
        condition: request_detected
        actions: [arbitrate_ibi_onto_bus]
        latency_cycles: 1
      - from: ARBITRATE_IBI
        to: ACK_IBI
        condition: ibi_won_arbitration
        actions: [ack_ibi]
        latency_cycles: 1
    functional_responsibilities: [detect_ibi_request, arbitrate_and_capture_payload]
    interfaces_touched: [i3c_bus_if]
    queues_used: [ibi_queue, interrupt_pending_queue]
    resources_used: [i3c_bus_port]
  - name: interrupt_control
    purpose: Aggregate transfer-done, NACK, and IBI-received events into a masked interrupt output.
    simpy_process: true
    states: [IDLE, EVALUATE_EVENTS, APPLY_MASK, ASSERT_IRQ, WAIT_SW_CLEAR, DEASSERT_IRQ]
    transitions:
      - from: EVALUATE_EVENTS
        to: APPLY_MASK
        condition: event_pending
        actions: [apply_mask]
        latency_cycles: 2
      - from: APPLY_MASK
        to: ASSERT_IRQ
        condition: unmasked_event
        actions: [assert_irq]
        latency_cycles: 2
    functional_responsibilities: [aggregate_events, drive_interrupt]
    interfaces_touched: [interrupt_if]
    queues_used: [interrupt_pending_queue]
    resources_used: [interrupt_line]

resources:
  - name: register_bus_port
    type: bus_port
    capacity: 1
    bandwidth: one_access_per_tick
    latency_cycles: 1
    arbitration: bus_order
    sharing_scope: global
  - name: i3c_bus_port
    type: open_drain_serial_port
    capacity: 1
    bandwidth: one_bit_per_shift
    latency_cycles: 1
    arbitration: command_engine_and_ibi_engine_share_bus_priority
    sharing_scope: global
  - name: interrupt_line
    type: irq_line
    capacity: 1
    bandwidth: level
    latency_cycles: 1
    arbitration: mask_priority
    sharing_scope: global

queues:
  - name: command_queue
    producer: register_access
    consumer: command_engine
    depth: 8
    blocking_behavior: backpressure
    ordering: fifo
  - name: tx_byte_queue
    producer: register_access
    consumer: command_engine
    depth: 8
    blocking_behavior: backpressure
    ordering: fifo
  - name: shift_queue
    producer: command_engine
    consumer: bit_transfer_engine
    depth: 4
    blocking_behavior: stall
    ordering: fifo
  - name: rx_byte_queue
    producer: bit_transfer_engine
    consumer: register_access
    depth: 8
    blocking_behavior: drop_on_full
    ordering: fifo
  - name: ibi_queue
    producer: ibi_engine
    consumer: register_access
    depth: 8
    blocking_behavior: drop_on_full
    ordering: fifo
  - name: interrupt_pending_queue
    producer: bit_transfer_engine_and_ibi_engine
    consumer: interrupt_control
    depth: 8
    blocking_behavior: stall
    ordering: fifo

fsm_relationships:
  fsm_count: 5
  parallel_processes:
    - [register_access, command_engine, bit_transfer_engine, ibi_engine, interrupt_control]
  sequential_paths:
    - name: command_transfer_path
      path: [command_engine.SEND_ADDRESS, bit_transfer_engine.SHIFT_BIT, bit_transfer_engine.BYTE_COMPLETE, interrupt_control.ASSERT_IRQ]
      description: A command is arbitrated and addressed, its bytes are shifted, and completion raises a transfer-done interrupt.
    - name: ibi_path
      path: [ibi_engine.ARBITRATE_IBI, ibi_engine.ACK_IBI, ibi_engine.READ_IBI_BYTE, interrupt_control.ASSERT_IRQ]
      description: An accepted IBI request is ACKed, its payload byte is read, and it raises an ibi-received interrupt.
    - name: command_to_dispatch_path
      path: [register_access.WRITE_CONFIG, command_engine.ARBITRATE_BUS]
      description: A queued command must be present before the command engine arbitrates for the bus.
  gating_relationships:
    - source: command_queue
      gates: command_engine.ARBITRATE_BUS
      stall_reason: command_queue_empty

timing_model:
  clock_mhz: 500
  cycle_time_ns: 2
  assumption: Hard-coded starter timing from I3C Master IP DLD.
  fsm_process_delays:
    - fsm: register_access
      mode: parallel_process
      operations:
        - {name: decode, cycles: 2, ns: 4}
        - {name: write_config, cycles: 2, ns: 4}
        - {name: read_status, cycles: 1, ns: 2}
    - fsm: command_engine
      mode: parallel_process
      operations:
        - {name: arbitrate_bus, cycles: 1, ns: 2}
        - {name: issue_start, cycles: 1, ns: 2}
        - {name: send_address, cycles: 1, ns: 2}
    - fsm: bit_transfer_engine
      mode: parallel_process
      operations:
        - {name: shift_bit, cycles: 1, ns: 2}
        - {name: sample_bit, cycles: 1, ns: 2}
        - {name: check_ack, cycles: 1, ns: 2}
    - fsm: ibi_engine
      mode: parallel_process
      operations:
        - {name: detect_request, cycles: 1, ns: 2}
        - {name: arbitrate_ibi, cycles: 1, ns: 2}
        - {name: ack_ibi, cycles: 1, ns: 2}
    - fsm: interrupt_control
      mode: parallel_process
      operations:
        - {name: evaluate_events, cycles: 2, ns: 4}
        - {name: apply_mask, cycles: 2, ns: 4}
        - {name: assert_irq, cycles: 2, ns: 4}
  end_to_end_paths:
    - name: command_dispatch_to_transfer_done_irq
      cycles: 19
      ns: 38
      path: [arbitrate_bus, issue_start, send_address, shift_bit, sample_bit, check_ack, evaluate_events, apply_mask, assert_irq]

functionality_model:
  implemented_in_simpy: true
  state_variables: [command_config, tx_queue_state, rx_queue_state, ibi_queue_state, transfer_status, interrupt_mask, transition_counts]
  apis: [configure, queue_command, write_tx, read_rx, read_ibi, raise_ibi_request, clear_interrupt, run, get_metrics]
  invariants:
    - A data byte is shifted only after the target address has been sent and ACKed.
    - An IBI payload byte is read only after the IBI request is ACKed.
    - A transfer-done or ibi-received interrupt stays asserted until software clears it.
  ignored_payload_details: [bit_level_open_drain_waveforms]

performance_model:
  language: python
  library: simpy
  abstraction_level: transaction
  model_functionality: true
  model_fsm_processes: true
  model_data_payloads: false
  model_interface_backpressure: true
  model_arbitration: true
  model_queue_occupancy: true
  model_latency_sources: [arbitration_delay, shift_delay, ack_delay, ibi_delay, interrupt_delay]
  metrics: [commands_issued, transmitted_bytes, received_bytes, transfers_completed, nack_count, ibi_requests, ibi_accepted, ibi_bytes_captured, interrupt_count, masked_interrupts, clear_latency]

test_scenarios:
  - name: private_write_completes_and_interrupts
    description: A queued write command shifts its bytes out and raises a transfer-done interrupt.
    input_sequence: [QUEUE_COMMAND_WRITE, WRITE_TX_ONE_BYTE]
    expected_functional_behavior: [byte_transmitted, transfer_done_interrupt]
    expected_performance_properties: [transfer_latency_measured]
    fsm_coverage: [register_access.WRITE_CONFIG, command_engine.SEND_ADDRESS, bit_transfer_engine.BYTE_COMPLETE, interrupt_control.ASSERT_IRQ]
  - name: private_read_captures_bytes
    description: A queued read command captures bytes shifted in by the target into the RX queue.
    input_sequence: [QUEUE_COMMAND_READ]
    expected_functional_behavior: [byte_received]
    expected_performance_properties: [read_latency_measured]
    fsm_coverage: [command_engine.SEND_ADDRESS, bit_transfer_engine.CHECK_ACK]
  - name: ibi_request_is_accepted_and_captured
    description: A target IBI request is detected, arbitrated onto the bus, ACKed, and its payload byte captured.
    input_sequence: [RAISE_IBI_REQUEST]
    expected_functional_behavior: [ibi_accepted, ibi_byte_captured, ibi_interrupt]
    expected_performance_properties: [ibi_latency_measured]
    fsm_coverage: [ibi_engine.ARBITRATE_IBI, ibi_engine.READ_IBI_BYTE, interrupt_control.ASSERT_IRQ]
  - name: masked_interrupt_suppresses_irq
    description: A masked transfer event does not assert the interrupt output.
    input_sequence: [CONFIGURE_INTERRUPT_MASK, QUEUE_COMMAND_WRITE, WRITE_TX_ONE_BYTE]
    expected_functional_behavior: [masked_interrupt_counted, no_interrupt]
    expected_performance_properties: [mask_suppresses_irq]
    fsm_coverage: [interrupt_control.APPLY_MASK, bit_transfer_engine.SHIFT_BIT]
