# Model review of src/ip_model_automation/timer_ip.py and tests/test_timer_ip.py
# against templates/timer_ip.template.yaml. See agents/model_review_agent.md.
#
# Re-run because tests/test_timer_ip.py changed since the prior review (which
# closed at M6): two tests were added,
# test_timer_effective_tick_to_irq_matches_the_declared_path and
# test_timer_watchdog_timeout_latency_matches_declared_cost, written to close
# M4 and M5 (see decisions/timer_ip.md). templates/timer_ip.template.yaml and
# src/ip_model_automation/timer_ip.py are byte-identical to the prior review;
# only the tests changed.
#
# Checked fresh against the current files: every declared interface
# wait_model against its process implementation (register_if, tick_if,
# interrupt_if); every fsm_processes transition and its latency_cycles;
# every queue depth against its simpy Store capacity; the gating_relationships
# entry against the processes it names; every command's valid/completion/error
# conditions against what the model does; and every test_scenario's
# expected_functional_behavior / expected_performance_properties against the
# test that claims to exercise it, including the two new tests.
#
# The two new tests were traced by hand against the template's declared
# figures. test_timer_effective_tick_to_irq_matches_the_declared_path: with
# prescaler_latency=1, counter_latency=1, compare_latency=3, interrupt_latency=6
# (matching the template's effective_tick_emit=1, count_update=1,
# compare_check+event_assert=2+1, collect_events+apply_mask+assert_irq=2+2+2),
# a raw tick presented at t=20 asserts an interrupt at t=31 -- an 11-cycle
# delta, matching end_to_end_paths.effective_tick_to_irq exactly.
# test_timer_watchdog_timeout_latency_matches_declared_cost: with
# watchdog_latency=3 (timeout_detect + timeout_publish = 1 + 2) and a
# timeout threshold of 5, the timeout fires at t=8 from arming, matching the
# declared 5 + 3. Both are mutation-sensitive (a wrong knob changes the
# asserted total), not tautological.
#
# The gating_relationships gap this review's predecessor found and the
# author dismissed by name (counter.COUNT not reflecting debug_freeze; see
# "M6 dismissed" in decisions/timer_ip.md) and the watchdog kick_reload cost
# the author ruled not implemented are both still present in the code
# unchanged. Neither is re-filed here under a new id: both were examined and
# adjudicated on the record already, and nothing about them is different in
# this pair of files. Refiling an already-dismissed, unchanged defect under a
# fresh id would not be a new disagreement -- it would be the same one
# finding a person has already read and decided about, counted twice.
#
# An empty findings list here is not a verdict that this model is faithful.
# It records that a reviewer looked at the current files and found no new
# disagreement beyond what is already on record; it does not, and cannot,
# approve the model or substitute for the gates.
