name: ip_generation_loop
description: Template-driven loop for generating and validating SimPy IP models.

# This file is the single source of truth for the pipeline stage sequence.
# tools/auto_ip_pipeline.py executes the `stages` list below in order, once
# per changed DLD; stages with `scope: repo` run once at the end instead.
# To add, remove, or reorder a stage, edit this file — not the runner.
#
# Stage fields:
#   kind: tool (default) — `command` runs as a subprocess from the repo root
#         with {placeholder} substitution; `python` resolves to the current
#         interpreter. Placeholders: {ip} {dld} {template} {draft}
#         {model_dir} {tests_dir} {prompt_pack_dir} {reports_dir}.
#         agent — an LLM/human step driven by --agent-cmd (or a prompt
#         request written to reports/agent_requests/).
#   gates: agent stages only — tool stages that decide the outcome. If they
#         all pass the agent is skipped; otherwise the agent runs and the
#         gates are re-checked after each attempt. A gate that passed here is
#         not re-run when reached in the main sequence.
#   max_attempts: agent stages only — attempts before the pipeline fails;
#         defaults to loop_policy.max_iterations.
#   when: model_new / model_exists — gate a stage on whether the IP's model
#         file existed at the START of this run (snapshot, not live): model_new
#         is the greenfield generate path, model_exists is the brownfield amend
#         path. They are mutually exclusive.
#         src_dld_exists — gate a stage on whether the IP has an unnormalized
#         author document (dlds/<ip>_dld.src.md). Independent of the two above.
#   awaiting_human: true — a required tool stage whose failure means "a human
#         step is pending", not "something is broken". The IP stops with an
#         *awaiting* status instead of a failure, the way an agent stage with no
#         profile does. Use it only where the pipeline cannot, in principle,
#         satisfy the gate itself.
#   scope: repo — run once after all changed IPs complete, not per IP
#         (skipped by --skip-final-gate).

inputs:
  dld_glob: dlds/*_dld.md
  src_dld_glob: dlds/*_dld.src.md
  template_glob: templates/*.template.yaml
  draft_glob: templates/*.template.draft.yaml
  model_dir: src/ip_model_automation
  tests_dir: tests
  prompt_pack_dir: prompt_packs
  reports_dir: reports

agent_contract: agents/ip_model_generation_agent.md
normalization_contract: agents/dld_normalization_agent.md
normalization_review_contract: agents/normalization_review_agent.md
model_review_contract: agents/model_review_agent.md

# Named agent commands for the `kind: agent` stages. Select one with
# `python tools/auto_ip_pipeline.py --agent <name>` (or pass a raw command
# via --agent-cmd, which overrides any profile). The pipeline is
# agent-agnostic — any coding agent works if its command:
#   - runs non-interactively (headless / auto-approve mode),
#   - reads the prompt from stdin,
#   - can create and edit files under the repo root,
#   - exits when done (exit code is logged; the gates decide pass/fail).
# The commands below are starting points — check the flags against the
# CLI version you have installed.
# "Auto-approve" has to cover running the repo's gates, not just editing files.
# Every agent contract here ends with a self-check the agent is told to run
# (check_dld_normalization.py, validate_dld_flow.py, ...). A profile that permits
# edits but not commands leaves the agent asking for approval into a pipe nobody
# is reading: it then reports done having verified nothing, which looks identical
# to success until a gate fails later. Observed with `--permission-mode
# acceptEdits` alone, which auto-approves only commands already allow-listed in
# .claude/settings.json.
agent_profiles:
  claude: claude -p --permission-mode acceptEdits --allowedTools "Bash(python:*)"
  codex: codex exec --full-auto -
  gemini: gemini --yolo

stages:
  - name: normalize_dld
    kind: agent
    command: external_agent_or_manual_edit
    required: false
    when: src_dld_exists
    gates: [check_normalization]
    max_attempts: 2
    notes: >
      Rewrite {src_dld} into the extractor-shaped {dld}, changing structure only —
      never adding, removing, altering, or rewording an engineering claim. Content
      that maps to no convention goes verbatim under "## Unplaced Source Content".
      Contract in agents/dld_normalization_agent.md. Runs only for an IP whose
      author document is not already in shape, and is skipped when the normalized
      DLD already passes the fidelity gate.
  - name: check_normalization
    command: python tools/check_dld_normalization.py {ip} --no-stamp-check
    required: true
    when: src_dld_exists
    notes: >
      Deterministic fidelity gate — measurement/identifier conservation in both
      directions, FSM name/count/state-set parity, wait-model provenance, and
      unplaced accounting. This is the half an agent can satisfy, so it is what
      drives the normalize_dld loop; the human stamp is checked by the next stage
      instead. Gating the agent on the stamp would make its loop unwinnable.
  - name: review_normalization
    kind: agent
    command: external_agent_or_manual_edit
    required: false
    when: src_dld_exists
    gates: [check_review_findings]
    max_attempts: 1
    notes: >
      Adversarial read of the normalization against its source, looking for claims
      whose meaning changed while their tokens survived. Writes
      reviews/{ip}.normalization.findings.yaml. Contract in
      agents/normalization_review_agent.md. Exists because check_normalization
      proves nothing was dropped, altered or invented, and cannot prove the
      surviving claims are attached to the right things - a delay moved to another
      FSM conserves every token and still times the model wrongly. It may fail a
      normalization and may never pass one: an empty findings list means nothing
      was found, not that the document is faithful. max_attempts is 1 deliberately
      - re-invoking a fail-only reviewer until it stops finding things is how it
      gets talked out of its findings.
  - name: check_review_findings
    command: python tools/check_review_findings.py {ip}
    required: true
    when: src_dld_exists
    awaiting_human: true
    notes: >
      Deterministic - every recorded finding, of any review kind, must be fixed
      (which makes that review stale) or dismissed by name in decisions/{ip}.md.
      Placed before the stamp because that is what a finding blocks: findings must
      not enter normalize_dld's retry loop, where a non-deterministic verdict
      inside max_attempts makes the loop unwinnable.
  - name: check_normalization_stamp
    command: python tools/check_dld_normalization.py {ip}
    required: true
    when: src_dld_exists
    awaiting_human: true
    notes: >
      The claim conservation cannot make: that the meaning survived. Earned per IP
      by a human reading the diff and running
      `python tools/check_dld_normalization.py --stamp <ip>`. Deliberately NOT
      stamped by the pipeline — unlike stamp_provenance, which records a fact the
      run itself establishes. An IP stops here as *awaiting* review, so nothing
      downstream promotes on an unreviewed normalization.
  - name: parse_dld
    command: python tools/dld_to_template.py {dld}
    required: true
    notes: Extract draft template + gaps report from the DLD.
  - name: complete_template
    kind: agent
    command: external_agent_or_manual_edit
    required: false
    gates: [check_dld_coverage, lint_template]
    max_attempts: 1
    notes: >
      Agent replaces every TODO_REVIEW in the draft using only DLD-stated
      behaviour, then promotes the draft to {template}. Skipped when the promoted
      template already passes both gates. Named complete_template, not
      review_template: it answers the questions the extractor could not, and
      nothing here reads a finished template looking for defects. Next to
      review_normalization and review_model - which are reviews, run under "may
      fail, never pass" - the old name implied a scrutiny step for promoted
      templates that has never existed.
  - name: check_dld_coverage
    command: python tools/check_template_coverage.py {template} {dld} --strict
    required: true
    notes: Template must cover DLD FSMs/count and contain no TODO_REVIEW.
  - name: lint_template
    command: python tools/template_lint.py {template}
    required: true
  - name: generate_scaffold
    command: python tools/generate_model_scaffold.py {template} --output-dir {model_dir}
    required: true
    when: model_new
    notes: New IPs only — never overwrites an existing model implementation.
  - name: generate_prompt_pack
    command: python tools/generate_prompt_pack.py {template} --output-dir {prompt_pack_dir}
    required: true
  - name: agent_implementation
    kind: agent
    command: external_agent_or_manual_edit
    required: false
    when: model_new
    gates: [unit_tests]
    notes: Greenfield only — agent fills a new model and tests from the prompt pack and agent contract; re-invoked with the failure log while unit_tests fails.
  - name: amend_implementation
    kind: agent
    command: external_agent_or_manual_edit
    required: false
    when: model_exists
    gates: [unit_tests]
    notes: Brownfield only — the DLD of an existing IP changed. The agent gets the structured template diff (tools/diff_template.py, prev committed template vs current) and edits the existing model/tests in place instead of rewriting. Skipped when unit_tests already pass.
  - name: unit_tests
    command: python -m unittest tests.test_{ip}
    required: true
    notes: Per-IP unit tests — the gate that drives the agent_implementation / amend_implementation loop.
  - name: review_model
    kind: agent
    command: external_agent_or_manual_edit
    required: false
    gates: [recheck_review_findings]
    max_attempts: 1
    notes: >
      Adversarial read of the model and its tests against their template, writing
      reviews/{ip}.model.findings.yaml. Contract in agents/model_review_agent.md.
      Exists because every other gate on the model shares one blind spot: the
      tests are written by the agent that writes the model, so a model that
      misimplements its contract and a test that agrees with it both pass. It may
      fail a model and may never pass one - an empty findings list means nothing
      was found, not that the model is faithful.
  - name: recheck_review_findings
    command: python tools/check_review_findings.py {ip}
    required: true
    awaiting_human: true
    notes: >
      The same deterministic gate as check_review_findings, run again here because
      it guards a second thing: the earlier instance sits before the normalization
      stamp and cannot see a model review that does not exist yet at that point.
      One tool, one rule - every recorded finding of any kind fixed or dismissed
      by name - asserted at both places a finding must not pass. Pauses as
      *awaiting* rather than failing: resolving a finding is a human step, and a
      sampled verdict must never sit inside an agent's retry loop.
  - name: stamp_provenance
    command: python tools/check_model_provenance.py --stamp {ip}
    required: true
    notes: Record the template revision this model is now in sync with (templates/model_baselines.json), so a later DLD edit is detected as drift. Runs for both greenfield and amend once unit_tests pass.
  - name: coverage_report
    command: python tools/report_model_coverage.py
    required: true
    scope: repo
    notes: FSM/scenario coverage declared in the templates.
  - name: wait_model_coverage
    command: python tools/check_wait_model_coverage.py
    required: true
    scope: repo
    notes: Hard gate — every interface wait point declared in a template must be a state the model actually enters, so a declared block (response wait, inline ack, deferred ack) cannot be documentation only.
  - name: code_style
    command: python tools/check_code_style.py
    required: true
    scope: repo
    notes: Hard gate — ruff lint + format check (rules in ruff.toml, guide in skills/ip-model-generation/references/coding_style.md); run with --fix to auto-repair.
  - name: code_coverage
    command: python tools/run_code_coverage.py --fail-under 95 --fail-under-file 95
    required: true
    scope: repo
    notes: Hard gate — line coverage of src/ip_model_automation from the unit tests must stay at 95%+ in total and per model file (report in reports/code_coverage/).
  - name: full_validation
    command: python tools/validate_dld_flow.py
    required: true
    scope: repo
    notes: Runs the DLD->template coverage gate then the model/test flow.

loop_policy:
  max_iterations: 3
  stop_on_first_pass: true
  fail_on_missing_draft: true
  fail_on_unresolved_todo_review: true
  fail_on_uncovered_dld_fsm: true
  fail_on_missing_prompt_pack: true
  fail_on_scaffold_shape_error: true
  fail_on_uncovered_fsm: true
  fail_on_unit_test_failure: true

pass_criteria:
  - normalized DLD faithful to its author source, and human-stamped (IPs with a .src.md only)
  - draft template and gaps report generated from DLD
  - promoted template has no TODO_REVIEW markers
  - template covers every DLD FSM and matching fsm_count
  - template lint passes
  - scaffold generation passes
  - prompt pack generation passes
  - every template FSM has scenario coverage
  - unit tests pass (greenfield generate, or brownfield amend from the template diff)
  - model provenance baseline stamped after unit tests pass
  - every recorded review finding fixed or dismissed by name
  - code style check passes (ruff lint + format)
