findings:
  - id: M7
    class: wait_model_impl
    severity: medium
    claim: >-
      host_control_if's wait_model declares a single wait_points entry,
      watchdog_main.ARMED, but the DISARM command it says this wait model
      covers also resolves (accepted.succeed() after the declared disarm
      latency) from watchdog_main.EXPIRED, a state the wait_points list does
      not mention.
    template: >-
      templates/watchdog_ip.template.yaml:17-23, interfaces[0].wait_model:
      mode wait_for_ack_inline, resumes_on: command_applied,
      wait_points: [watchdog_main.ARMED], with the note "this wait model
      covers ARM/KICK/DISARM". DISARM's own valid_conditions
      (templates/watchdog_ip.template.yaml:66,
      watchdog_armed_or_expired) confirm it is legal, and declared as a
      transition, from both ARMED and EXPIRED
      (templates/watchdog_ip.template.yaml:101-104 and 111-114).
    model: >-
      src/ip_model_automation/watchdog_ip.py:189-200 (_run_expired). DISARM
      received while fsm_state["watchdog_main"] == "EXPIRED" yields
      env.timeout(self.latency["disarm"]) and then calls accepted.succeed()
      before fsm_state is ever updated away from "EXPIRED" (the state is
      only set to "DISARMED" later, back at the top of the watchdog_main()
      loop at line 107) -- so this DISARM's command_applied ack fires while
      the FSM is in EXPIRED, not ARMED. Contrast with the ARMED-state DISARM
      path at lines 156-164, whose ack does fire while fsm_state is ARMED,
      matching the declared wait_points.
    why: >-
      A reader using host_control_if's wait_points to find every state in
      which this interface's wait_for_ack_inline blocking is observable would
      miss the EXPIRED case entirely, even though the template's own notes
      say this wait model covers DISARM, and DISARM's valid_conditions
      explicitly include the expired state.
