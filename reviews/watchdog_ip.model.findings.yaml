ip: watchdog_ip
kind: model
template_sha256: a700839ea41b5039a384d4f6d318cefdddbb568c5a7111e26824ba58c154408a
model_sha256: 6c4524324a9abab68637b9cb31f0d820f7d2591dc3b91ac64716f849656f90a1
tests_sha256: 56deacf63db3656bbe7b74a380fcca3034c7a514f3667d06e8d440d94b641058
findings:
  - id: M8
    class: scenario_gap
    severity: medium
    claim: >-
      test_scenarios[0] (kick_before_expiry_prevents_expiration) declares
      input_sequence [CONFIGURE_TIMEOUT, ARM, KICK], but the test written for
      it never issues a CONFIGURE_TIMEOUT command -- the timeout is set by
      passing default_timeout_cycles directly to the model constructor,
      bypassing the config_intake FSM entirely.
    template: >-
      templates/watchdog_ip.template.yaml test_scenarios[0]
      (kick_before_expiry_prevents_expiration), lines 206-211:
      input_sequence: [CONFIGURE_TIMEOUT, ARM, KICK].
    model: >-
      tests/test_watchdog_ip.py:26-56
      test_kick_before_expiry_prevents_expiration -- driver() only calls
      model.arm() and model.kick() (lines 46-49); default_timeout_cycles=20
      is supplied via make_model(env, default_timeout_cycles=20) at line 43,
      never through model.configure_timeout().
    why: >-
      A reader relying on the docstring's "template test_scenarios[0]" label
      would believe the CONFIGURE_TIMEOUT step of the declared sequence, and
      therefore the config_intake IDLE->APPLY_TIMEOUT->IDLE path feeding a
      value into this scenario's ARM, is exercised here. It is not: the
      command path from host_control_if through config_intake into
      configured_timeout_cycles is never invoked by this test at all.
  - id: M9
    class: scenario_gap
    severity: medium
    claim: >-
      test_scenarios[1] (countdown_reaches_zero_without_kick_expires)
      declares input_sequence [CONFIGURE_TIMEOUT, ARM], but the test written
      for it never issues a CONFIGURE_TIMEOUT command -- the timeout is set
      by passing default_timeout_cycles directly to the model constructor,
      bypassing the config_intake FSM entirely.
    template: >-
      templates/watchdog_ip.template.yaml test_scenarios[1]
      (countdown_reaches_zero_without_kick_expires), lines 212-217:
      input_sequence: [CONFIGURE_TIMEOUT, ARM].
    model: >-
      tests/test_watchdog_ip.py:58-97
      test_countdown_reaches_zero_without_kick_expires -- driver() only
      calls model.arm(), env.timeout(20), and model.disarm() (lines 71-73);
      default_timeout_cycles=5 is supplied via make_model(env,
      default_timeout_cycles=5) at line 68, never through
      model.configure_timeout().
    why: >-
      Same gap as M8: the docstring ties this test to
      test_scenarios[1], but the CONFIGURE_TIMEOUT leg of the declared
      sequence, and the config_intake command path it would exercise, is
      never run. Only the ARM/expiry portion of the scenario is actually
      covered.
