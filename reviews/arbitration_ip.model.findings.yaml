ip: arbitration_ip
kind: model
template_sha256: 0c112356198a8f94f3a55a4bdd1c79783e585f08b725d1969c375d5ff933520c
model_sha256: 15f328c1ec62d6c72b7993b70a773e919980c90fd175bb0d37ebab7f0849b8be
tests_sha256: 07760d1621b87b1140a7d490b3561a393405f35181dc4fccc74b1ce4092312a0
findings:
- id: M9
  class: fsm_structure
  severity: medium
  claim: >-
    arbiter_main never enters IDLE from either state the template says it is entered from: both
    declared transitions into IDLE (RESET -> IDLE and GRANT -> IDLE) are never taken, and the model
    takes undeclared RESET -> PORT_SCAN and GRANT -> PORT_SCAN instead, because IDLE is entered only
    when the pending bitmaps happen to be dirty.
  template: >-
    templates/arbitration_ip.template.yaml:115-119 declares `from: RESET, to: IDLE, condition:
    reset_deasserted, actions: [clear_state], latency_cycles: 1` and :145-149 declares `from: GRANT,
    to: IDLE, condition: selected_sq_accepted_by_issue_pipeline, actions:
    [send_selected_sq_to_issue_pipeline]`. :102-103 describes IDLE as `Wait for queue activity or
    downstream availability`, and :120-124 makes IDLE -> PORT_SCAN the only declared way into a scan.
  model: >-
    src/ip_model_automation/arbitration_ip.py:338-348 - after the reset timeout the loop enters IDLE
    only `if self.bitmap_dirty`, and :340 `_clear_state()` calls `_update_pending_bitmaps()` which
    clears that flag, so the first pass always falls through to PORT_SCAN at :349. Measured by
    stepping the environment at default latencies with a command arriving at t=100: arbiter_main goes
    RESET@0-1 -> PORT_SCAN@1-5 -> STALL@5-6 -> PORT_SCAN@6-10 ... (no IDLE), and after the grant
    GRANT@122-124 -> PORT_SCAN@124 directly; IDLE is entered once, at t=101-104, out of STALL - a
    transition the template also does not declare. `python tools/check_declared_transitions.py
    arbitration_ip` reports the same two as NEVER TAKEN and lists GRANT -> PORT_SCAN and RESET ->
    PORT_SCAN as UNDECLARED.
  why: >-
    The template's arbiter returns to a wait state after every grant and after reset; the model never
    does, so IDLE is not a wait state at all but a 3-cycle bitmap-refresh step that a command's
    arrival phase decides whether to charge. A reader of the FSM, and any scenario counting on IDLE as
    the resting state between grants, is told about a structure the simulation does not have, and the
    declared reset path RESET -> IDLE is not the path the model takes even though its `clear_state`
    action is performed.
- id: M10
  class: wait_model_impl
  severity: medium
  claim: >-
    qos_credit_if declares its wait point at arbiter_main.TENANT_SCAN, but the eligibility sample that
    decides the grant is taken at the end of SQ_SCAN, eight cycles after TENANT_SCAN has been left.
  template: >-
    templates/arbitration_ip.template.yaml:51-64 declares qos_credit_if with `mode: wait_for_response`,
    `wait_points: [arbiter_main.TENANT_SCAN]`, `resumes_on: credit_status_sampled` and
    `response_used_for: "the eligibility result decides whether the candidate may be granted"`, and the
    eligibility_check transaction with `timing_notes: sampled during candidate evaluation`. :130-134
    puts the tenant decision on TENANT_SCAN -> SQ_SCAN (`condition: eligible_tenant_found`, `actions:
    [record_selected_tenant]`), and :317 prices tenant_scan at 6 cycles.
  model: >-
    src/ip_model_automation/arbitration_ip.py:360-364 - TENANT_SCAN is entered and its 6-cycle timeout
    is yielded with no work done in it; SQ_SCAN is then entered and its 8-cycle timeout yielded, and
    only afterwards does :364 call `select_sq()`, which runs `_select_port`, `_select_tenant` (:278-290,
    where `sample_eligibility` is called at :285) and `_select_sq` back to back. Measured by wrapping
    `sample_eligibility` and recording `env.now` and `fsm_state["arbiter_main"]` at the call: with one
    command queued at defaults the only sample is `(t=19, 'SQ_SCAN', 'T0')`, while TENANT_SCAN spans
    t=5-11.
  why: >-
    The interface's response is sampled in the wrong state and 8 cycles late, so the credit status the
    grant depends on is the status at the end of the SQ scan, not the status at the declared wait
    point. The three processes run concurrently, so credit that changes during those 8 cycles produces
    a different grant than the contract describes, and every stall the model attributes to
    `no_tenant_pending_stalls` (:306) has already paid sq_scan's 8 cycles it should not have reached.
- id: M11
  class: wait_model_impl
  severity: high
  claim: >-
    issue_if declares its wait point inside issue_pipeline.ISSUE_REQUEST, but the model tests
    issue_ready only before entering that state, then holds ISSUE_REQUEST for the full 3-cycle request
    and pops the commands unconditionally - so a command leaves the ingress queue while issue_ready is
    low and the pipeline is not in ISSUE_STALL.
  template: >-
    templates/arbitration_ip.template.yaml:38-46 declares issue_if `mode: wait_for_ack_inline`,
    `wait_points: [issue_pipeline.ISSUE_REQUEST]`, `resumes_on: issue_ready`, `notes: "... while
    `issue_ready` is low the pipeline holds in `ISSUE_STALL` and no command leaves the ingress queue"`.
    :351 and :356 state the invariants `Commands are popped only when issue_ready is true` and `Queue
    entries remain pending during downstream backpressure`; :303-305 gates issue_pipeline.ISSUE_REQUEST
    on issue_if.issue_ready with `stall_reason: output_backpressure`.
  model: >-
    src/ip_model_automation/arbitration_ip.py:398-412 - the `while not self.output_ready` loop runs
    *before* `_set_fsm_state("issue_pipeline", "ISSUE_REQUEST")` at :405; after it the model yields
    `latency["issue"]` (:406) and then pops `issue_count` commands at :409-412 with no further check of
    `output_ready`. Measured: default latencies, one command, `set_issue_ready(False)` driven at t=31
    while fsm_state["issue_pipeline"] == "ISSUE_REQUEST" - the command is still popped at t=34, the
    downstream request is recorded at t=36, the ingress queue is left empty and
    `output_backpressure_cycles` stays 0. No test in tests/test_arbitration_ip.py lowers issue_ready
    after the request has started: test_arbitration_downstream_backpressure_holds_selected_sq
    (tests/test_arbitration_ip.py:285-315) lowers it before the grant only.
  why: >-
    Backpressure that arrives during the issue request - the ready-low case a valid_ready handshake
    exists to express, and one any user of the declared `set_issue_ready` API can drive - is dropped:
    the command is popped, the burst counters are debited and issued_commands is incremented while the
    downstream is not accepting. Both stated invariants are false in that window, and the model
    silently under-reports output_backpressure_cycles for it.
- id: M12
  class: fsm_structure
  severity: medium
  claim: >-
    The declared PORT_SCAN -> STALL transition is taken without its declared
    `increment_no_eligible_stall` action, so the `no_port_pending_stalls` metric the template names is
    never incremented for a no-eligible-port stall; the only increments it ever receives come from a
    race in which the bitmaps empty mid-scan.
  template: >-
    templates/arbitration_ip.template.yaml:140-144 declares `from: PORT_SCAN, to: STALL, condition:
    no_eligible_port, actions: [increment_no_eligible_stall], latency_cycles: 1`, :299-301 declares the
    gating relationship `source: port_pending_bitmap, gates: arbiter_main.PORT_SCAN, stall_reason:
    no_port_pending`, and :370 lists `no_port_pending_stalls` among performance_model.metrics.
  model: >-
    src/ip_model_automation/arbitration_ip.py:354-359 takes the transition (`if not
    any(self.port_pending_bitmap.values())`) but increments only `metrics["stalls"]`; the sole
    `metrics["no_port_pending_stalls"]` increment is at :301 inside `select_sq()`, which is reached
    only after that check has already passed. Measured: an idle model stepped for 500 cycles reports
    `{'resets': 1, 'bitmap_updates': 1, 'stalls': 99}` with no_port_pending_stalls absent entirely.
    Across 40 randomized traffic runs the counter reaches 144 against 26921 stalls - those 144 come
    from the 14 cycles of tenant_scan+sq_scan between the check at :354 and `select_sq()` at :364,
    during which issue_pipeline's `_update_pending_bitmaps()` (:420) can clear the last pending bit.
  why: >-
    A declared per-reason stall counter that reads 0 while the arbiter stalls 99 times in 500 idle
    cycles will be read as "the arbiter never stalled for want of a pending port", which is the exact
    opposite of what happened, and the 0.5% of stalls it does record measure a mid-scan race rather
    than the declared condition. Class note: the transition itself is taken, so this is the closest
    class in the closed vocabulary - the defect is the declared action of a declared transition, not
    the transition.
- id: M13
  class: scenario_gap
  severity: medium
  claim: >-
    burst_min_issue_count's declared performance properties are exercised by nothing: the test named
    for it sets the three latencies to 1 and asserts no time at all, and no other test asserts any
    issue_pipeline timing.
  template: >-
    templates/arbitration_ip.template.yaml:393-398 test_scenarios burst_min_issue_count declares
    `expected_performance_properties: [pending_count_read_latency, burst_read_latency,
    min_calculation_latency]` with `fsm_coverage: [issue_pipeline.READ_PENDING_COUNT,
    issue_pipeline.READ_BURST, issue_pipeline.CALC_ISSUE_COUNT, issue_pipeline.ISSUE_REQUEST,
    issue_pipeline.UPDATE_BURST]`, against timing_model :330-335 selection_accept 1, pending_count_read
    3, burst_read 4, min_burst_calculation 2, downstream_issue_request 3, burst_debit 2.
  model: >-
    tests/test_arbitration_ip.py:258-283 (test_arbitration_issue_pipeline_uses_min_burst_and_pending_count)
    constructs the model with pending_count_latency=1, burst_read_latency=1, burst_calc_latency=1,
    issue_latency=1 and asserts only counts and queue contents; it never reads env.now or a recorded
    time. The one default-latency timing test, tests/test_arbitration_ip.py:158-196, measures
    arbiter_main states only and stops at the first downstream request. Measured by mutation: changing
    each of the model's defaults at src/ip_model_automation/arbitration_ip.py:44-50 -
    pending_count_latency 3->9, burst_read_latency 4->9, burst_calc_latency 2->9, issue_latency 3->9,
    burst_debit_latency 2->9 - leaves all 13 tests passing in every case, while the same mutation
    applied to bitmap, port_scan, tenant_scan, sq_scan or grant fails
    test_arbitration_charges_its_declared_latencies_at_defaults.
  why: >-
    The issue pipeline charges its six declared operations correctly today - measured end to end, the
    new_command_to_issue path is exactly the declared 38 cycles - but nothing holds it there. Every
    latency on the half of the timing model that this scenario exists to pin can be changed to any
    value with the suite green, so a regression in the burst path is invisible, and the scenario's
    fsm_coverage claims coverage of five states whose timing no assertion touches.
- id: M14
  class: scenario_gap
  severity: medium
  claim: >-
    weighted_order_four_tenants exercises the port and tenant levels of the declared arbitration
    hierarchy but not the SQ level: the test named for it projects the selection trace onto tenant_id,
    so the declared SQ weights are asserted by nothing and the SQ policy can be disabled outright with
    the suite green.
  template: >-
    templates/arbitration_ip.template.yaml:373-386 test_scenarios weighted_order_four_tenants declares
    `expected_functional_behavior: [weighted_order_respected]` with `fsm_coverage: [...
    arbiter_main.SQ_SCAN, ...]` and an input_sequence spanning nine distinct SQs; :271 declares
    `hierarchy: [port, tenant, sq]`, :275 `sqs: {SQ0: 4, SQ1: 2, SQ2: 1, SQ3: 1}`, and :355 the
    invariant `Weighted round-robin order is deterministic for equal bitmap availability`.
  model: >-
    tests/test_arbitration_ip.py:121-156 - both test_arbitration_weighted_order_across_four_tenants and
    the helper it uses return `[entry["tenant_id"] for entry in model.selection_trace]`, discarding
    sq_id; the same projection is used at :88 for the two-tenant helper. Measured by mutation:
    neutering the SQ-level pointer advance in src/ip_model_automation/arbitration_ip.py:454
    (`self.sq_policies[...].advance_to_after(...)`) leaves all 13 tests passing, while neutering the
    tenant-level advance at :453 fails three of them. The mutation is not behaviourally inert: under
    sustained load into T1's four SQs the selection order is SQ0,SQ1,SQ2,SQ3,SQ0,SQ1,SQ1,SQ2,... with
    the advance and SQ0,SQ1,SQ0,SQ0,SQ1,SQ0,SQ0,SQ0,... without it - SQ0 starves the rest.
  why: >-
    One of the three declared levels of this IP's headline QoS property has no test that can fail for
    it. A regression that made SQ selection strict-first-pending rather than weighted round-robin -
    starving SQ1..SQ3 whenever SQ0 stays pending - would leave the whole suite green, and the scenario
    that names SQ_SCAN in its coverage would still be reported as covered.
- id: M15
  class: timing_mismatch
  severity: low
  claim: >-
    The declared end-to-end path no_stall_command_issue is priced at 23 cycles but the model charges 20
    for the four operations the path lists; the only test that pins it reaches 23 by adding
    bitmap_update, which that path does not include.
  template: >-
    templates/arbitration_ip.template.yaml:337-340 declares `no_stall_command_issue, cycles: 23, ns:
    46, path: [port_scan, tenant_scan, sq_scan, grant_selected_sq]`, whose operations are priced at
    :316-319 as 4 + 6 + 8 + 2 = 20 cycles. bitmap_update (3 cycles, :315) appears only in the other
    path, new_command_to_issue (:341-344).
  model: >-
    src/ip_model_automation/arbitration_ip.py:349-372 charges exactly the four declared operation
    values. Measured by stepping the environment at defaults with a command arriving at t=100:
    PORT_SCAN@104 -> TENANT_SCAN@108 -> SQ_SCAN@114 -> GRANT@122, grant complete at 124, i.e. 20 cycles
    for the declared path (the other declared path, new_command_to_issue, measures exactly 38 from
    IDLE@101 to the end of UPDATE_BURST@139 and does agree). tests/test_arbitration_ip.py:158-196
    asserts `grant_completes - entered["IDLE"] == 23`, measuring from the IDLE bitmap refresh, and its
    docstring states the sum as `bitmap_update 3 + port_scan 4 + tenant_scan 6 + sq_scan 8 +
    grant_selected_sq 2` - five operations for a four-operation path.
  why: >-
    The 23-cycle figure and its own operand list cannot both hold, so the model cannot satisfy the path
    as written; it satisfies the operand list. The test then pins the total from a different starting
    point than the path names, which makes the disagreement look resolved. Low severity because every
    priced operation and the other end-to-end path measure exactly as declared - the likely correction
    is to the template's path or figure rather than to the model, which is a person's call and possibly
    review_normalization's.
