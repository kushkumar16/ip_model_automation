ip:
  name: completion_ip
  domain: nvme_controller
  description: Tracks command completion, applies QoS token rules, and emits host-facing completions.
  clock_domains:
    - name: core_clk
      frequency_mhz: null
  reset:
    type: sync
    behavior: clear_pending_queues_tokens_and_metrics

interfaces:
  - name: accepted_cmd_if
    type: command_accept
    direction: input
    clock_domain: core_clk
    wait_model:
      mode: wait_for_ack_inline
      requester: peer
      wait_points: [accept.ENQUEUE]
      resumes_on: accept_ready
      source: dld
      notes: "the producer needs no result, only the accept; a full pending queue holds the FSM in `BACKPRESSURE` and deasserts `ready`"
    transactions:
      - name: accept_command
        fields: [cmd_id, tenant_id, source_id, opcode, size_kb, arrival_time, nominal_service_latency, status_hint]
        handshake: valid_ready
        timing_notes: command enters per-tenant pending queue when accepted
  - name: qos_config_if
    type: configuration
    direction: input
    clock_domain: core_clk
    wait_model:
      mode: wait_for_ack_inline
      requester: peer
      wait_points: [refill.REFILL_BASE]
      resumes_on: config_applied
      source: dld
    transactions:
      - name: tenant_config
        fields: [tenant_alive, read_iops_per_sec, write_iops_per_sec, read_bw_kb_per_sec, write_bw_kb_per_sec]
        handshake: register_write_or_static_config
        timing_notes: sampled at reset and on config update
  - name: completion_queue_if
    type: completion_output
    direction: output
    clock_domain: core_clk
    wait_model:
      mode: wait_for_ack_inline
      requester: this_ip
      wait_points: [completion_scheduler.STALL_OUTPUT]
      resumes_on: cpl_ready
      source: dld
      notes: "`EMIT` is the act of emitting, not the wait: while `cpl_ready` is low the scheduler holds in `STALL_OUTPUT` and the completion stays queued. The wait point used to name `EMIT` while this note named `STALL_OUTPUT`, and the two could not both be true. Measured through a stall: `EMIT` occupied 0 cycles, `STALL_OUTPUT` 26."
    transactions:
      - name: emit_completion
        fields: [cmd_id, tenant_id, status, latency]
        handshake: valid_ready
        timing_notes: completion is held when cpl_ready is low

commands:
  - name: READ
    description: Read completion candidate.
    fields: [tenant_id, cmd_id, size_kb, status]
    valid_conditions: [service_latency_elapsed, tenant_alive, read_tokens_available, output_ready]
    completion_conditions: [completion_emitted]
    error_conditions: [tenant_inactive, read_token_starvation]
  - name: WRITE
    description: Write completion candidate.
    fields: [tenant_id, cmd_id, size_kb, status]
    valid_conditions: [service_latency_elapsed, tenant_alive, write_tokens_available, output_ready]
    completion_conditions: [completion_emitted]
    error_conditions: [tenant_inactive, write_token_starvation]
  - name: FLUSH
    description: Ordered completion command.
    fields: [tenant_id, cmd_id, status]
    valid_conditions: [ordering_conditions_met, output_ready]
    completion_conditions: [completion_emitted]
    error_conditions: [ordering_timeout]

fsm_processes:
  - name: accept
    purpose: Accepts command descriptors into per-tenant pending queues.
    simpy_process: true
    states: [RESET, READY, ENQUEUE, BACKPRESSURE]
    transitions:
      - from: RESET
        to: READY
        condition: reset_deasserted
        actions: [clear_pending_queues]
        latency_cycles: 1
      - from: READY
        to: ENQUEUE
        condition: incoming_valid_and_queue_space
        actions: [enqueue_command]
        latency_cycles: 1
      - from: READY
        to: BACKPRESSURE
        condition: incoming_valid_and_queue_full
        actions: [increment_queue_full_stall]
        latency_cycles: 1
      - from: BACKPRESSURE
        to: READY
        condition: queue_space_available
        actions: []
        latency_cycles: 0
    interfaces_touched: [accepted_cmd_if]
    queues_used: [tenant_pending_queues]
    resources_used: []
  - name: completion_scheduler
    purpose: Selects pending commands, checks token availability, and emits completions.
    simpy_process: true
    states: [RESET, IDLE, SELECT_TENANT, CHECK_TOKENS, WAIT_TOKENS, EMIT, STALL_OUTPUT]
    transitions:
      - from: IDLE
        to: SELECT_TENANT
        condition: any_eligible_tenant
        actions: [load_weighted_tenant_order]
        latency_cycles: 1
      - from: SELECT_TENANT
        to: CHECK_TOKENS
        condition: candidate_found
        actions: [peek_candidate]
        latency_cycles: 1
      - from: CHECK_TOKENS
        to: EMIT
        condition: required_tokens_available_and_output_ready
        actions: [debit_tokens]
        latency_cycles: 1
      - from: CHECK_TOKENS
        to: WAIT_TOKENS
        condition: required_tokens_unavailable
        actions: [increment_token_stall]
        latency_cycles: 1
      - from: EMIT
        to: SELECT_TENANT
        condition: more_candidates
        actions: [pop_candidate, publish_completion, update_metrics]
        latency_cycles: 1
      - from: EMIT
        to: STALL_OUTPUT
        condition: output_not_ready
        actions: [hold_completion, increment_output_stall]
        latency_cycles: 1
      - from: WAIT_TOKENS
        to: SELECT_TENANT
        condition: next_dispatch_tick_or_refill
        actions: []
        latency_cycles: 1
    interfaces_touched: [completion_queue_if]
    queues_used: [tenant_pending_queues]
    resources_used: [completion_output_port]
  - name: refill
    purpose: Refills base tokens and snapshots metrics.
    simpy_process: true
    states: [WAIT_WINDOW, ASSESS_USAGE, REFILL_BASE, PUBLISH_METRICS]
    transitions:
      - from: WAIT_WINDOW
        to: ASSESS_USAGE
        condition: window_timer_expired
        actions: [snapshot_window_usage]
        latency_cycles: 0
      - from: ASSESS_USAGE
        to: REFILL_BASE
        condition: usage_snapshot_done
        actions: [restore_base_tokens]
        latency_cycles: 0
      - from: REFILL_BASE
        to: PUBLISH_METRICS
        condition: base_tokens_restored
        actions: [write_window_metrics]
        latency_cycles: 0
      - from: PUBLISH_METRICS
        to: WAIT_WINDOW
        condition: metrics_published
        actions: []
        latency_cycles: 0
    interfaces_touched: [qos_config_if]
    queues_used: []
    resources_used: []

resources:
  - name: completion_output_port
    type: completion_port
    capacity: 1
    bandwidth: one_completion_per_dispatch_tick
    latency_cycles: 1
    note: >-
      This cycle is charged off the completion's critical path, not on it:
      end_to_end_paths.no_stall_completion states 21 cycles over a list this
      port is not in, so charging it inline would make that path 22 and break a
      figure the model matches exactly. The model holds the port across the emit
      and releases it one cycle later from a background process, so the
      completion finishes at the end of the emit while the port stays busy for
      its own latency -- which is where a capacity of 1 is meant to be felt.
      See decisions/completion_ip.md. The bandwidth figure above remains
      unmodelled and unreconciled with the 21-cycle path; that is recorded
      there too rather than resolved in the model's favour.
    arbitration: weighted_round_robin
    sharing_scope: global

queues:
  - name: tenant_pending_queues
    producer: accepted_cmd_if
    consumer: completion_scheduler
    depth: unbounded
    depth_note: DLD leaves completion queue depth open; the model keeps per-tenant pending queues unbounded — backpressure comes from QoS token gating and output cpl_ready, not queue capacity.
    blocking_behavior: stall
    ordering: fifo_per_tenant

qos:
  window_ms: 10
  dispatch_tick_ms: 1
  bandwidth_token_bytes: 512
  token_scale: 2.0
  token_classes: [read, write, read_bw, write_bw]
  insufficient_token_behavior: command_remains_pending_until_refill

fsm_relationships:
  fsm_count: 3
  parallel_processes:
    - [accept, completion_scheduler, refill]
  sequential_paths:
    - name: command_completion_path
      path: [accept.ENQUEUE, completion_scheduler.SELECT_TENANT, completion_scheduler.CHECK_TOKENS, completion_scheduler.EMIT]
      description: >-
        Command must be accepted before the scheduler can check tokens and emit its
        completion. An ordering constraint, not a serial timing chain: accept and
        completion_scheduler run as parallel_processes, so the enqueue overlaps the
        scheduler's tenant select rather than running before it. See
        timing_model.end_to_end_paths.no_stall_completion.
    - name: token_refill_path
      path: [refill.ASSESS_USAGE, refill.REFILL_BASE, refill.PUBLISH_METRICS]
      description: Refill updates token state observed by scheduler.
  gating_relationships:
    - source: token_availability
      gates: completion_scheduler.EMIT
      stall_reason: token_stall
    - source: completion_queue_if.cpl_ready
      gates: completion_scheduler.EMIT
      stall_reason: output_backpressure

timing_model:
  clock_mhz: 500
  cycle_time_ns: 2
  assumption: Hard-coded starter timing from Completion IP DLD.
  fsm_process_delays:
    - fsm: accept
      mode: parallel_process
      operations:
        - {name: enqueue, cycles: 4, ns: 8}
        - {name: queue_full_retry, cycles: 1, ns: 2}
    - fsm: completion_scheduler
      mode: parallel_process
      operations:
        - {name: tenant_select, cycles: 8, ns: 16}
        - {name: token_check, cycles: 5, ns: 10}
        - {name: completion_emit, cycles: 4, ns: 8}
        - {name: output_stall_retry, cycles: 1, ns: 2}
    - fsm: refill
      mode: periodic_process
      operations:
        - {name: refill_window, cycles: 5000000, ns: 10000000}
        - {name: usage_assessment, cycles: 20, ns: 40}
        - {name: base_refill, cycles: 10, ns: 20}
        - {name: metrics_publish, cycles: 10, ns: 20}
  end_to_end_paths:
    - name: no_stall_completion
      cycles: 21
      ns: 42
      path: [accepted_command_enqueue, tenant_select, token_check, completion_emit]
      note: >-
        4 + 8 + 5 + 4, the figure the DLD states. This was briefly changed to 17
        on the reasoning that accept and completion_scheduler are declared
        parallel_processes, so a command's 4-cycle enqueue overlaps the 8-cycle
        select rather than preceding it. That is true only of a scheduler that
        selects before it has a candidate, and the design does not: Completion IP
        maintains the set of tenants with active traffic and available tokens,
        and the scheduler leaves IDLE only while that set is non-empty. A tenant
        cannot become eligible before its command has been enqueued, so the
        enqueue is on the critical path. The DLD says the same thing twice -- in
        this figure and in the sequential dependency "accept/enqueue must
        complete before the scheduler can select the command" -- and the 17 was
        the template disagreeing with it. Measured at model defaults once the
        model follows this: a single READ completes at t=21. See
        sequential_paths.command_completion_path.

functionality_model:
  implemented_in_simpy: true
  state_variables: [eligible_tenants, tenant_pending_queues, tenant_tokens, tenant_alive, completed_commands, window_metrics, stall_counters, fsm_state, transition_counts]
  apis: [configure_tenant, accept_command, set_completion_ready, run, get_completed, get_metrics]
  invariants:
    - A completion is emitted only after required tokens are debited.
    - A command whose tenant lacks sufficient base tokens remains pending until the next refill window.
  ignored_payload_details: [nvme_completion_entry_bit_layout, data_payload_bytes]

performance_model:
  language: python
  library: simpy
  abstraction_level: transaction
  model_functionality: true
  model_fsm_processes: true
  model_data_payloads: false
  model_interface_backpressure: true
  model_arbitration: true
  model_queue_occupancy: true
  model_latency_sources: [nominal_service_latency, token_wait, output_backpressure, queue_wait]
  metrics: [completed_read_cmds, completed_write_cmds, latency, throughput, utilization, queue_depth, token_stalls, output_stalls]

test_scenarios:
  - name: write_debits_write_budget
    description: A write completion consumes write IOPS and write bandwidth tokens only.
    input_sequence: [T0_WRITE_4K]
    expected_functional_behavior: [completion_emitted_when_write_tokens_available]
    expected_performance_properties: [write_iops_tokens_reduced, read_iops_tokens_unchanged]
    fsm_coverage: [accept.ENQUEUE, completion_scheduler.CHECK_TOKENS, completion_scheduler.EMIT]
  - name: token_starvation_blocks_completion
    description: A tenant with insufficient base tokens cannot complete until refill.
    input_sequence: [T0_WRITE_4K_WITH_ZERO_TOKENS]
    expected_functional_behavior: [completion_not_emitted]
    expected_performance_properties: [token_stall_incremented]
    fsm_coverage: [completion_scheduler.WAIT_TOKENS]
  - name: output_backpressure_holds_completion
    description: Ready completion remains pending while completion output is blocked.
    input_sequence: [T0_READ_4K, cpl_ready_low]
    expected_functional_behavior: [completion_not_popped_until_ready]
    expected_performance_properties: [output_stall_incremented]
    fsm_coverage: [completion_scheduler.STALL_OUTPUT]
  - name: refill_restores_token_window
    description: Refill window restores base tokens and publishes metrics.
    input_sequence: [TOKEN_WINDOW_EXPIRES]
    expected_functional_behavior: [base_tokens_restored]
    expected_performance_properties: [window_metric_snapshot_recorded]
    fsm_coverage: [refill.ASSESS_USAGE, refill.REFILL_BASE, refill.PUBLISH_METRICS]
