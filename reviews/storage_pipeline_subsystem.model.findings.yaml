ip: storage_pipeline_subsystem
kind: model
template_sha256: 2e699282ae10f069c7f0edd1ac119868eb925526a041cb6e847473fa8146cb1d
model_sha256: 2e90b283b190d824428e9ea10f2205e757e0788bf1389f4a596917075c245b35
tests_sha256: 72afbb466e378d5f2abc9a70b51ead552c344e53854685568f556ea50dd50a69
findings:
  - id: M3
    class: timing_mismatch
    severity: high
    claim: >-
      qos_configuration_if's host ack fires one glue cycle after the config
      is actually applied to the Completion IP, not at the qos_config_applied
      event the interface names as the resume condition -- the same
      extra-cycle-late-ack pattern the model's own comments say was already
      found and fixed on the command_intake_if path (round thirteen's M2),
      but that fix was never carried over to this path.
    template: >-
      qos_configuration_if.wait_model declares `wait_points:
      [intake_bridge.APPLY_QOS_CONFIG]` and `resumes_on: qos_config_applied`
      (templates/storage_pipeline_subsystem.template.yaml:48-49), and its
      transaction's timing_notes state the ack is "applied synchronously
      once the bridge reaches the config state, no further than the
      Completion IP's own configure_tenant already defers it"
      (templates/storage_pipeline_subsystem.template.yaml:55).
    model: >-
      src/ip_model_automation/storage_pipeline_subsystem.py:158-171 --
      self.completion.configure_tenant(...) is called at line 158, while the
      bridge is already in APPLY_QOS_CONFIG (2 glue cycles after dequeue),
      which is the qos_config_applied event and the point the timing_notes
      bound the delay against. But accepted.succeed() is deferred to line
      171, after one more `yield self.env.timeout(1)` for the separate
      APPLY_QOS_CONFIG -> IDLE transition (3 cycles total), the same shape
      of bug the model's own comment at lines 132-138 describes fixing for
      command_intake_if: acking one glue cycle later than the transition
      that actually performs the effect the interface names.
    why: >-
      A host waiting on configure_qos() is resumed a full glue cycle later
      than "no further than the Completion IP's own configure_tenant already
      defers it" commits to, and later than the resumes_on: qos_config_applied
      event the interface names -- a simulated timing error on this
      interface's own inline-ack path, of exactly the kind already confirmed
      as a real bug and fixed on the sibling command path.
  - id: M4
    class: scenario_gap
    severity: medium
    claim: >-
      test_scenarios[1] (qos_config_flows_to_completion_ip) declares
      expected_performance_properties: [qos_config_applied_promptly], but
      the test written for it never asserts anything about when the config
      is applied or the host is acked -- only that it eventually happens by
      an arbitrarily generous deadline.
    template: >-
      templates/storage_pipeline_subsystem.template.yaml:255-260 --
      test_scenarios[1].expected_performance_properties: [qos_config_applied_promptly].
    model: >-
      tests/test_storage_pipeline_subsystem.py:127-150 --
      test_qos_config_flows_to_completion_ip runs `env.run(until=10)` and
      then checks accepted.processed, qos_configs_applied, the four token
      values, and two transition counts, with no assertion on env.now (or
      any other measure of promptness), unlike the command scenario's
      dedicated ack-timing test
      (test_command_ack_completes_at_enqueue_not_after_the_return_transition,
      tests/test_storage_pipeline_subsystem.py:46-72), which does pin down
      exactly when its ack fires.
    why: >-
      This test would pass unchanged even if the ack were delayed by an
      arbitrary number of extra cycles (as in M3), so a reader relying on it
      to see qos_config_applied_promptly exercised is misled -- the scenario
      it is named for is not actually checking the property it names.
