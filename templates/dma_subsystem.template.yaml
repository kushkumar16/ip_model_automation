ip:
  name: dma_subsystem
  domain: soc_subsystem
  description: Connected DMA data-mover subsystem composing the GDMA engine, AXI interconnect, arbitration IP, and completion IP with glue processes and cross-IP backpressure.
  clock_domains:
    - name: bus_clk
      frequency_mhz: 500
  reset:
    type: sync
    behavior: reset_members_and_clear_tracking_tables

subsystem:
  members:
    - {ip: gdma_ip, model: GdmaIpModel, role: descriptor_engine}
    - {ip: axi_interconnect_ip, model: AxiInterconnectIpModel, role: fabric_router}
    - {ip: arbitration_ip, model: ArbitrationIpModel, role: downstream_scheduler}
    - {ip: completion_ip, model: CompletionIpModel, role: qos_accounting}
  connections:
    # ack: does the source (or the subsystem on its behalf) wait for a done
    # signal from the destination before the work counts as complete?
    #   none                 -> fire-and-forget; only queue backpressure applies
    #   completion_event     -> a completion record must come back (ack_via
    #                           names the return path that carries it)
    #   level_until_serviced -> a level signal stays asserted until the
    #                           destination side services and clears it
    - {from: host_command, to: gdma_ip.submit, payload: descriptor, ack: completion_event, ack_via: gdma_ip.completed_ids -> completion_collector}
    - {from: host_command, to: axi_interconnect_ip.submit, payload: read_and_write_commands, ack: completion_event, ack_via: axi_interconnect_ip.responses -> fabric_bridge}
    - {from: axi_interconnect_ip.responses, to: fabric_bridge, payload: routed_command}
    - {from: fabric_bridge, to: arbitration_ip.enqueue, payload: tenant_mapped_command, ack: none}
    - {from: arbitration_ip.issued, to: downstream_dispatch, payload: issued_command}
    - {from: downstream_dispatch, to: completion_ip.submit, payload: qos_command, ack: completion_event, ack_via: completion_ip.completed -> completion_collector}
    - {from: completion_ip.completed, to: completion_collector, payload: accounted_completion}
    - {from: gdma_ip.completed_ids, to: completion_collector, payload: engine_completion}
    - {from: backpressure_monitor, to: gdma_ip.set_memory_ready, payload: fabric_congestion, ack: none}
    - {from: backpressure_monitor, to: arbitration_ip.set_issue_ready, payload: completion_backlog, ack: none}

interfaces:
  - name: host_descriptor_if
    type: descriptor_queue
    direction: input
    clock_domain: bus_clk
    transactions:
      - name: descriptor_submit
        fields: [desc_id, channel_id, src_addr, dst_addr, length_bytes]
        handshake: queue_put
        timing_notes: accepted immediately; downstream stalls surface as end-to-end latency
  - name: subsystem_interrupt_if
    type: interrupt
    direction: output
    clock_domain: bus_clk
    transactions:
      - name: descriptor_complete_irq
        fields: [irq_valid, channel_id]
        handshake: level
        timing_notes: fires only after both engine and fabric legs complete
  - name: qos_config_if
    type: config
    direction: input
    clock_domain: bus_clk
    transactions:
      - name: qos_tenant_config
        fields: [tenant_id, token_budget]
        handshake: immediate
        timing_notes: takes effect before subsequent completion scheduling decisions

commands:
  - name: SUBMIT_DESCRIPTOR
    description: Host submits a DMA descriptor to the subsystem.
    fields: [desc_id, channel_id, src_addr, dst_addr, length_bytes]
    valid_conditions: [channel_enabled_in_gdma]
    completion_conditions: [engine_leg_complete, fabric_read_accounted, fabric_write_accounted]
    error_conditions: [gdma_rejects_descriptor]
    functional_effects: [forward_to_engine, create_fabric_commands]
    timing_effects: [glue_intake_delay, member_ip_pipeline_delays]
  - name: CONFIGURE_QOS
    description: Configure a tenant's completion-IP token budget.
    fields: [tenant_id, token_budget]
    valid_conditions: [known_tenant]
    completion_conditions: [config_applied]
    error_conditions: []
    functional_effects: [update_completion_tokens]
    timing_effects: [config_delay]
  - name: REFILL_QOS
    description: Trigger a completion-IP token refill window.
    fields: []
    valid_conditions: []
    completion_conditions: [tokens_refilled]
    error_conditions: []
    functional_effects: [refill_completion_tokens]
    timing_effects: [refill_delay]

fsm_processes:
  - name: host_command
    purpose: Accept host descriptors, forward them to the GDMA engine, and create read/write fabric commands.
    simpy_process: true
    states: [IDLE, ACCEPT_DESCRIPTOR, FORWARD_ENGINE, BUILD_FABRIC_COMMANDS, SUBMIT_FABRIC]
    transitions:
      - from: IDLE
        to: ACCEPT_DESCRIPTOR
        condition: descriptor_available
        actions: [dequeue_descriptor]
        latency_cycles: 1
      - from: ACCEPT_DESCRIPTOR
        to: FORWARD_ENGINE
        condition: descriptor_accepted
        actions: [submit_to_gdma]
        latency_cycles: 1
      - from: BUILD_FABRIC_COMMANDS
        to: SUBMIT_FABRIC
        condition: commands_built
        actions: [submit_read_and_write_to_interconnect]
        latency_cycles: 1
    functional_responsibilities: [descriptor_intake, engine_forward, fabric_command_creation]
    interfaces_touched: [host_descriptor_if]
    queues_used: [descriptor_intake_queue, fabric_tracking_table]
    resources_used: [gdma_engine_member, fabric_router_member]
  - name: fabric_bridge
    purpose: Bridge interconnect responses into the arbitration IP's port/tenant/SQ queues.
    simpy_process: true
    states: [IDLE, POLL_RESPONSES, MAP_TENANT, ENQUEUE_ARBITRATION]
    transitions:
      - from: IDLE
        to: POLL_RESPONSES
        condition: tick
        actions: [read_new_interconnect_responses]
        latency_cycles: 1
      - from: POLL_RESPONSES
        to: MAP_TENANT
        condition: new_response
        actions: [map_channel_to_tenant]
        latency_cycles: 1
      - from: MAP_TENANT
        to: ENQUEUE_ARBITRATION
        condition: tenant_mapped
        actions: [enqueue_into_arbitration]
        latency_cycles: 1
    functional_responsibilities: [response_polling, tenant_mapping, arbitration_enqueue]
    interfaces_touched: [host_descriptor_if]
    queues_used: [fabric_tracking_table]
    resources_used: [fabric_router_member, downstream_arbiter_member]
  - name: downstream_dispatch
    purpose: Submit arbitration-issued commands into the completion IP's QoS path.
    simpy_process: true
    states: [IDLE, POLL_ISSUED, SUBMIT_COMPLETION]
    transitions:
      - from: IDLE
        to: POLL_ISSUED
        condition: tick
        actions: [read_new_issued_commands]
        latency_cycles: 1
      - from: POLL_ISSUED
        to: SUBMIT_COMPLETION
        condition: new_issued_command
        actions: [submit_to_completion_ip]
        latency_cycles: 1
    functional_responsibilities: [issue_polling, completion_submission]
    interfaces_touched: [qos_config_if]
    queues_used: [pending_completion_table]
    resources_used: [downstream_arbiter_member, qos_completion_member]
  - name: completion_collector
    purpose: Match accounted and engine completions to descriptors, mark them complete, and raise the subsystem interrupt.
    simpy_process: true
    states: [IDLE, POLL_COMPLETIONS, MATCH_DESCRIPTOR, MARK_COMPLETE, ASSERT_IRQ]
    transitions:
      - from: IDLE
        to: POLL_COMPLETIONS
        condition: tick
        actions: [read_completion_and_engine_lists]
        latency_cycles: 1
      - from: POLL_COMPLETIONS
        to: MATCH_DESCRIPTOR
        condition: new_completion
        actions: [match_to_descriptor]
        latency_cycles: 1
      - from: MARK_COMPLETE
        to: ASSERT_IRQ
        condition: both_legs_complete
        actions: [assert_subsystem_irq]
        latency_cycles: 1
    functional_responsibilities: [leg_matching, descriptor_completion, interrupt_assertion]
    interfaces_touched: [subsystem_interrupt_if]
    queues_used: [pending_completion_table]
    resources_used: [qos_completion_member, gdma_engine_member, subsystem_interrupt_line]
  - name: backpressure_monitor
    purpose: Mirror fabric congestion into GDMA memory readiness and completion backlog into arbitration issue readiness.
    simpy_process: true
    states: [IDLE, SAMPLE_FABRIC, APPLY_ENGINE_THROTTLE, SAMPLE_COMPLETION_BACKLOG, APPLY_ISSUE_THROTTLE]
    transitions:
      - from: IDLE
        to: SAMPLE_FABRIC
        condition: tick
        actions: [sample_interconnect_outstanding]
        latency_cycles: 2
      - from: SAMPLE_FABRIC
        to: APPLY_ENGINE_THROTTLE
        condition: congestion_changed
        actions: [set_gdma_memory_ready]
        latency_cycles: 1
      - from: SAMPLE_COMPLETION_BACKLOG
        to: APPLY_ISSUE_THROTTLE
        condition: backlog_changed
        actions: [set_arbitration_issue_ready]
        latency_cycles: 1
    functional_responsibilities: [congestion_sampling, engine_throttle, issue_throttle]
    interfaces_touched: [qos_config_if]
    queues_used: [pending_completion_table]
    resources_used: [gdma_engine_member, fabric_router_member, downstream_arbiter_member, qos_completion_member]

resources:
  - name: gdma_engine_member
    type: member_ip_model
    capacity: 1
    bandwidth: per_gdma_template
    latency_cycles: 1
    arbitration: internal
    sharing_scope: subsystem
  - name: fabric_router_member
    type: member_ip_model
    capacity: 1
    bandwidth: per_interconnect_template
    latency_cycles: 1
    arbitration: internal
    sharing_scope: subsystem
  - name: downstream_arbiter_member
    type: member_ip_model
    capacity: 1
    bandwidth: per_arbitration_template
    latency_cycles: 1
    arbitration: internal
    sharing_scope: subsystem
  - name: qos_completion_member
    type: member_ip_model
    capacity: 1
    bandwidth: per_completion_template
    latency_cycles: 1
    arbitration: internal
    sharing_scope: subsystem
  - name: subsystem_interrupt_line
    type: irq_line
    capacity: 1
    bandwidth: level
    latency_cycles: 1
    arbitration: none
    sharing_scope: global

queues:
  - name: descriptor_intake_queue
    producer: host
    consumer: host_command
    depth: 16
    blocking_behavior: backpressure
    ordering: fifo
  - name: fabric_tracking_table
    producer: host_command
    consumer: fabric_bridge
    depth: 32
    blocking_behavior: stall
    ordering: keyed_by_cmd_id
  - name: pending_completion_table
    producer: downstream_dispatch
    consumer: completion_collector
    depth: 32
    blocking_behavior: stall
    ordering: keyed_by_desc_id

fsm_relationships:
  fsm_count: 5
  parallel_processes:
    - [host_command, fabric_bridge, downstream_dispatch, completion_collector, backpressure_monitor]
  sequential_paths:
    - name: descriptor_fabric_path
      path: [host_command.SUBMIT_FABRIC, fabric_bridge.ENQUEUE_ARBITRATION, downstream_dispatch.SUBMIT_COMPLETION, completion_collector.ASSERT_IRQ]
      description: A descriptor's fabric commands are routed, scheduled, accounted, and finally matched into the subsystem interrupt.
    - name: engine_leg_path
      path: [host_command.FORWARD_ENGINE, completion_collector.MARK_COMPLETE]
      description: The engine leg completes inside the GDMA member and is matched by the collector.
    - name: backpressure_path
      path: [backpressure_monitor.SAMPLE_FABRIC, backpressure_monitor.APPLY_ENGINE_THROTTLE]
      description: Fabric congestion is sampled before the engine throttle is applied.
  gating_relationships:
    - source: pending_completion_table
      gates: completion_collector.ASSERT_IRQ
      stall_reason: legs_incomplete
    - source: fabric_router_member
      gates: host_command.SUBMIT_FABRIC
      stall_reason: fabric_congested

timing_model:
  clock_mhz: 500
  cycle_time_ns: 2
  assumption: Hard-coded starter timing for glue processes from DMA Subsystem DLD; member IP timing comes from member templates.
  fsm_process_delays:
    - fsm: host_command
      mode: parallel_process
      operations:
        - {name: accept_descriptor, cycles: 1, ns: 2}
        - {name: forward_engine, cycles: 1, ns: 2}
        - {name: submit_fabric, cycles: 1, ns: 2}
    - fsm: fabric_bridge
      mode: parallel_process
      operations:
        - {name: poll_responses, cycles: 1, ns: 2}
        - {name: map_tenant, cycles: 1, ns: 2}
        - {name: enqueue_arbitration, cycles: 1, ns: 2}
    - fsm: downstream_dispatch
      mode: parallel_process
      operations:
        - {name: poll_issued, cycles: 1, ns: 2}
        - {name: submit_completion, cycles: 1, ns: 2}
    - fsm: completion_collector
      mode: parallel_process
      operations:
        - {name: poll_completions, cycles: 1, ns: 2}
        - {name: match_descriptor, cycles: 1, ns: 2}
        - {name: assert_irq, cycles: 1, ns: 2}
    - fsm: backpressure_monitor
      mode: parallel_process
      operations:
        - {name: sample_fabric, cycles: 2, ns: 4}
        - {name: apply_throttle, cycles: 1, ns: 2}
  end_to_end_paths:
    - name: glue_overhead_per_descriptor
      cycles: 11
      ns: 22
      path: [accept_descriptor, forward_engine, submit_fabric, poll_responses, map_tenant, enqueue_arbitration, poll_issued, submit_completion, poll_completions, match_descriptor, assert_irq]

functionality_model:
  implemented_in_simpy: true
  state_variables: [descriptor_tracking, fabric_leg_status, engine_leg_status, tenant_mapping, backpressure_state, transition_counts]
  apis: [submit, configure_channel, configure_qos, refill_qos, set_route, run, get_metrics]
  invariants:
    - A descriptor's fabric commands are submitted only after the descriptor is forwarded to the engine.
    - A command enters the completion QoS path only after arbitration issues it.
    - The subsystem interrupt for a descriptor fires only after both its engine leg and both fabric completions are observed.
    - Fabric congestion deasserts GDMA memory readiness until congestion clears.
  ignored_payload_details: [data_contents, address_translation]

performance_model:
  language: python
  library: simpy
  abstraction_level: transaction
  model_functionality: true
  model_fsm_processes: true
  model_data_payloads: false
  model_interface_backpressure: true
  model_arbitration: true
  model_queue_occupancy: true
  model_latency_sources: [member_ip_pipelines, glue_bridging, qos_token_stalls, fabric_backpressure]
  metrics: [descriptors_submitted, fabric_commands_issued, arb_enqueued, completions_collected, descriptors_completed, subsystem_irqs, fabric_backpressure_events, completion_backlog_events, end_to_end_latency]

test_scenarios:
  - name: single_descriptor_end_to_end
    description: One descriptor flows through all four member IPs and raises the subsystem interrupt after both legs complete.
    input_sequence: [SUBMIT_DESCRIPTOR]
    expected_functional_behavior: [engine_leg_complete, fabric_legs_accounted, descriptor_completed, subsystem_irq]
    expected_performance_properties: [end_to_end_latency_measured]
    fsm_coverage: [host_command.SUBMIT_FABRIC, fabric_bridge.ENQUEUE_ARBITRATION, downstream_dispatch.SUBMIT_COMPLETION, completion_collector.ASSERT_IRQ]
  - name: fabric_backpressure_throttles_engine
    description: Saturating interconnect outstanding credit deasserts GDMA memory readiness and stalls the engine.
    input_sequence: [SUBMIT_DESCRIPTOR_BURST]
    expected_functional_behavior: [fabric_backpressure_observed, engine_stalled, all_descriptors_eventually_complete]
    expected_performance_properties: [backpressure_events_counted]
    fsm_coverage: [backpressure_monitor.SAMPLE_FABRIC, backpressure_monitor.APPLY_ENGINE_THROTTLE, host_command.ACCEPT_DESCRIPTOR]
  - name: qos_tokens_gate_completions
    description: A tenant with insufficient completion tokens stalls its completions until a refill window.
    input_sequence: [CONFIGURE_QOS_LOW_TOKENS, SUBMIT_DESCRIPTOR, REFILL_QOS]
    expected_functional_behavior: [token_stall_observed, completion_after_refill]
    expected_performance_properties: [qos_stall_latency_measured]
    fsm_coverage: [downstream_dispatch.POLL_ISSUED, completion_collector.MATCH_DESCRIPTOR]
  - name: multi_channel_descriptors_complete_independently
    description: Descriptors on two channels map to two tenants and both complete with interrupts.
    input_sequence: [SUBMIT_DESCRIPTOR_CH0, SUBMIT_DESCRIPTOR_CH1]
    expected_functional_behavior: [both_descriptors_completed, two_subsystem_irqs]
    expected_performance_properties: [per_channel_latency_measured]
    fsm_coverage: [fabric_bridge.MAP_TENANT, completion_collector.MARK_COMPLETE, backpressure_monitor.SAMPLE_COMPLETION_BACKLOG]
